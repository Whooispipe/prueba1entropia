      display: flex;
      justify-content: center;
      align-items: center;

      position: relative;

      gap: 8px;

    }

      font-size: 10px;

    }

      margin-bottom: 14px;
      font-size: 9.5px;

      height: 10px;
      background-color: #222;

      font-size: 12px;
      line-height: 1.7;
      letter-spacing: 0.5px;

      color: var(--ut-yellow);
      margin-bottom: 8px;
      display: block;
      font-size: 11px;
    }

      border: 2px dashed var(--hint-cyan);
      background: #041419;
      color: var(--hint-cyan);

/* =========================================================================
   1. SISTEMA DE AUDIO BLINDADO PARA iOS WEBKIT
   ========================================================================= */
let audioCtx = null;
let soundEnabled = true;

function unlockAudioContext() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) {
      audioCtx = new AudioContextClass();
    }
  }
  if (audioCtx && (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted')) {
    audioCtx.resume().catch(() => {});
  }
}

['touchstart', 'touchend', 'click', 'pointerdown'].forEach(evt => {
  document.addEventListener(evt, unlockAudioContext, { passive: true, once: false });
});

function toggleAudio() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById("muteBtn");
  if (btn) btn.innerText = soundEnabled ? "SONIDO: ON" : "SONIDO: OFF";
}

function playBleep(freq = 440, type = 'square', duration = 0.05) {
  if (!soundEnabled) return;
  try {
    unlockAudioContext();
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

function playDamageSound() {
  if (!soundEnabled) return;
  try {
    unlockAudioContext();
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.25);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.25);
  } catch (e) {}
}

function playVictorySound() {
  if (!soundEnabled) return;
  const notes = [261.6, 329.6, 392.0, 523.3];
  notes.forEach((freq, idx) => {
    setTimeout(() => playBleep(freq, 'triangle', 0.16), idx * 120);
  });
}

function playGameOverSting() {
  if (!soundEnabled) return;
  const notes = [220, 207.6, 196, 185];
  notes.forEach((freq, idx) => {
    setTimeout(() => playBleep(freq, 'sawtooth', 0.32), idx * 240);
  });
}

function saveProgressToFile() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(userProgress));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", `progreso_admin_undertale_${Date.now()}.json`);
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
}

function loadProgressFromFile(event) {
  const fileReader = new FileReader();
  if (event.target.files && event.target.files[0]) {
    fileReader.readAsText(event.target.files[0], "UTF-8");
    fileReader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (parsed && Array.isArray(parsed.completedPhases)) {
          userProgress = parsed;
          localStorage.setItem('undertale_admin_progress', JSON.stringify(userProgress));
          alert("¡Progreso cargado con éxito!");
          renderMainMenu();
        } else {
          alert("Archivo de progreso inválido.");
        }
      } catch (err) {
        alert("Error al leer el archivo.");
      }
    };
  }
}

function prepareShuffledQuiz(rawList) {
  const cloned = rawList.map(item => {
    const optionsWithMeta = item.options.map((optText, origIdx) => ({
      text: optText,
      isCorrect: origIdx === item.ans
    }));

    for (let i = optionsWithMeta.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [optionsWithMeta[i], optionsWithMeta[j]] = [optionsWithMeta[j], optionsWithMeta[i]];
    }

    const newCorrectIdx = optionsWithMeta.findIndex(o => o.isCorrect);

    return {
      id: item.id,
      phase: item.phase,
      q: item.q,
      options: optionsWithMeta.map(o => o.text),
      ans: newCorrectIdx,
      hint: item.hint,
      exp: item.exp
    };
  });

  for (let i = cloned.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
  }

  return cloned;
}

          <span class="phase-badge" style="border-color:#00ffff;">1 Vida</span>
        </button>
        <button class="option-btn ${isDone(8) ? 'completed-unit' : ''}" style="border-color:var(--ut-orange); color:var(--ut-orange);" onclick="startMarathonAll()">
          <span class="soul-icon">❤️</span>
          <span>⭐ 8. MARATÓN TOTAL (Banco Completo)</span>
          <span class="phase-badge ${isDone(8) ? 'done' : ''}" style="border-color:var(--ut-orange);">${isDone(8) ? '✓ COMPLETADA' : 'Completo'}</span>
        </button>
      </div>

      <div class="save-load-row">
        <button class="save-load-btn" onclick="saveProgressToFile()">💾 Guardar / Descargar Progreso</button>
        <button class="save-load-btn" onclick="document.getElementById('fileInputLoader').click()">📂 Cargar Archivo de Progreso</button>
        <input type="file" id="fileInputLoader" style="display:none" accept=".json" onchange="loadProgressFromFile(event)">
      </div>
    </div>
  `;
}

function startPastExam() {
  unlockAudioContext();
  playBleep(587.3, 'square', 0.1);
  gameState.currentPhase = 99;
  gameState.isSansBattle = false;
  gameState.isMarathon = false;
  const filtered = MASTER_QUESTION_BANK.filter(q => q.isPastExam);
  gameState.phaseQuestions = prepareShuffledQuiz(filtered);
  gameState.currentIndex = 0;
  gameState.score = 0;
  gameState.playerHP = 5;
  gameState.maxHP = 5;
  updateStatusUI();
  renderQuestionUI();
}

function startAdventure(phaseNum) {
  unlockAudioContext();
  playBleep(523.3, 'square', 0.1);
  gameState.currentPhase = phaseNum;
  gameState.isSansBattle = false;
  gameState.isMarathon = false;
  const filtered = MASTER_QUESTION_BANK.filter(q => q.phase === phaseNum);
  gameState.phaseQuestions = prepareShuffledQuiz(filtered);
  gameState.currentIndex = 0;
  gameState.score = 0;
  gameState.playerHP = 5;
  gameState.maxHP = 5;
  updateStatusUI();
  renderQuestionUI();
}

function startSansTrial() {
  unlockAudioContext();
  playBleep(140, 'sawtooth', 0.2);
  gameState.currentPhase = 7;
  gameState.isSansBattle = true;
  gameState.isMarathon = false;
  gameState.phaseQuestions = prepareShuffledQuiz(MASTER_QUESTION_BANK).slice(0, 35);
  gameState.currentIndex = 0;
  gameState.score = 0;
  gameState.playerHP = 1;
  gameState.maxHP = 1;
  updateStatusUI();
  renderQuestionUI();
}

function startMarathonAll() {
  unlockAudioContext();
  playBleep(659, 'triangle', 0.15);
  gameState.currentPhase = 8;
  gameState.isSansBattle = false;
  gameState.isMarathon = true;
  gameState.phaseQuestions = prepareShuffledQuiz(MASTER_QUESTION_BANK);
  gameState.currentIndex = 0;
  gameState.score = 0;
  gameState.playerHP = 10;
  gameState.maxHP = 10;
  updateStatusUI();
  renderQuestionUI();
}

function updateStatusUI() {
  const statusBar = document.getElementById("statusBar");
  statusBar.style.display = "flex";
  if (gameState.isMarathon) {
    document.getElementById("currentPhaseLabel").innerText = "MARATÓN TOTAL";
  } else {
    document.getElementById("currentPhaseLabel").innerText = PHASES_NAMES[gameState.currentPhase] || `FASE ${gameState.currentPhase}`;
  }
  document.getElementById("hpText").innerText = `${gameState.playerHP}/${gameState.maxHP}`;
  
  const fillPct = (gameState.playerHP / gameState.maxHP) * 100;
  document.getElementById("hpBarFill").style.width = `${Math.max(0, fillPct)}%`;
}

function renderQuestionUI() {
  const container = document.getElementById("screenContent");
  const qData = gameState.phaseQuestions[gameState.currentIndex];

  let optionsHTML = "";
  qData.options.forEach((opt, idx) => {
    optionsHTML += `
      <button class="option-btn" onclick="checkAnswer(${idx})" onmouseover="playBleep(320, 'sine', 0.02)">
        <span class="soul-icon">❤️</span>
        <span>${String.fromCharCode(65 + idx)}) ${opt}</span>
      </button>
    `;
  });

  const totalQ = gameState.phaseQuestions.length;
  const currentQNum = gameState.currentIndex + 1;
  const progressPct = (gameState.currentIndex / totalQ) * 100;

  container.innerHTML = `
    <div class="progress-section">
      <div style="display:flex; justify-content:space-between;">
        <span>Progreso de Unidad (${totalQ >= 50 ? 'Modo Completo' : 'Unidad Actual'}):</span>
        <span style="color:var(--hint-cyan);">${gameState.currentIndex} / ${totalQ}</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" style="width: ${progressPct}%;"></div>
      </div>
    </div>

    <div class="dialogue-box" id="questionTextBox">
      <span class="dialogue-prefix">* PREGUNTA ${currentQNum} DE ${totalQ}:</span>
      ${qData.q}
    </div>

    <div class="hint-box" id="hintBox"></div>

    <div class="feedback-panel" id="feedbackPanel"></div>

    <div class="options-container" id="optionsContainer">
      ${optionsHTML}
    </div>

    <div class="footer-actions">
      <button class="action-btn" onclick="renderMainMenu()">
        <span class="soul-icon">❤️</span>
        <span>MENÚ</span>
      </button>
      <button class="action-btn hint-btn" id="hintBtn" onclick="toggleHint()">
        <span class="soul-icon">❤️</span>
        <span>PISTA</span>
      </button>
      <div style="font-size:10px; color:#888;">CORRECTAS: ${gameState.score}</div>
      <button class="action-btn" id="nextQuestionBtn" style="display:none;" onclick="nextQuestion()">
        <span class="soul-icon">❤️</span>
        <span>SIGUIENTE ➔</span>
      </button>
    </div>
  `;

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleHint() {
  unlockAudioContext();
  playBleep(440, 'triangle', 0.08);
  const hintBox = document.getElementById("hintBox");
  const qData = gameState.phaseQuestions[gameState.currentIndex];
  if (!hintBox) return;

  if (hintBox.style.display === "none" || hintBox.style.display === "") {
    hintBox.style.display = "block";
    hintBox.innerHTML = `💡 <strong>PISTA:</strong><br>${qData.hint || "Analiza los conceptos clave vistos en las diapositivas y textos de clase."}`;
  } else {
    hintBox.style.display = "none";
  }
}

function checkAnswer(selectedIdx) {
  unlockAudioContext();
  const qData = gameState.phaseQuestions[gameState.currentIndex];
  const feedback = document.getElementById("feedbackPanel");
  const nextBtn = document.getElementById("nextQuestionBtn");
  const optionsContainer = document.getElementById("optionsContainer");

  const buttons = optionsContainer.getElementsByTagName("button");
  for (let b of buttons) {
    b.disabled = true;
    b.style.opacity = "0.65";
    b.style.cursor = "default";
  }

  if (selectedIdx === qData.ans) {
    playBleep(587.3, 'triangle', 0.15);
    gameState.score++;
    feedback.className = "feedback-panel correct";
    feedback.style.display = "block";
    feedback.innerHTML = `
      <strong>¡CORRECTO!</strong><br>
      ${qData.exp}
    `;
    nextBtn.style.display = "flex";
  } else {
    playDamageSound();
    gameState.playerHP--;
    updateStatusUI();

    feedback.className = "feedback-panel incorrect";
    feedback.style.display = "block";
    feedback.innerHTML = `
      <strong>¡RESPUESTA INCORRECTA!</strong><br>
      Opción correcta: <strong>${String.fromCharCode(65 + qData.ans)}) ${qData.options[qData.ans]}</strong><br>
      <em>${qData.exp}</em>
    `;

    if (gameState.playerHP <= 0) {
      setTimeout(() => triggerGameOver(), 800);
      return;
    } else {
      nextBtn.style.display = "flex";
    }
  }
}

function nextQuestion() {
  unlockAudioContext();
  gameState.currentIndex++;
  if (gameState.currentIndex < gameState.phaseQuestions.length) {
    renderQuestionUI();
  } else {
    const targetPhase = gameState.isMarathon ? 8 : gameState.currentPhase;
    if (!userProgress.completedPhases.includes(targetPhase)) {
      userProgress.completedPhases.push(targetPhase);
      try {
        localStorage.setItem('undertale_admin_progress', JSON.stringify(userProgress));
      } catch(e){}
    }
    triggerVictory();
  }
}

function retryCurrentPhase() {
  unlockAudioContext();
  if (gameState.currentPhase === 99) {
    startPastExam();
  } else if (gameState.isSansBattle) {
    startSansTrial();
  } else if (gameState.isMarathon) {
    startMarathonAll();
  } else {
    startAdventure(gameState.currentPhase);
  }
}

function triggerVictory() {
  playVictorySound();
  document.getElementById("statusBar").style.display = "none";
  const container = document.getElementById("screenContent");
  
  let rank = "C - Administrador Junior";
  if (gameState.score >= gameState.phaseQuestions.length * 0.9) rank = "S - ADMINISTRADOR LEGENDARIO";
  else if (gameState.score >= gameState.phaseQuestions.length * 0.75) rank = "A - GERENTE ESTRATÉGICO";
  else if (gameState.score >= gameState.phaseQuestions.length * 0.5) rank = "B - ANALISTA SENIOR";

  container.innerHTML = `
    <div class="screen-overlay">
      <div style="font-size:38px; margin-bottom:14px;">🏆❤️</div>
      <div class="screen-title" style="color:#00ff00;">¡UNIDAD COMPLETADA CON ÉXITO!</div>
      <p style="font-size:10.5px; line-height:1.8; max-width:580px; color:#eee;">
        Has superado este módulo. ¡Su estado se ha marcado en verde en el menú!
      </p>
      <div style="margin:16px 0; border:3px solid var(--ut-yellow); padding:14px; font-size:10.5px; line-height:1.6;">
        PUNTUACIÓN FINAL: ${gameState.score} / ${gameState.phaseQuestions.length}<br>
        RANGO ALCANZADO: <span style="color:var(--ut-yellow);">${rank}</span>
      </div>
      <div class="menu-grid">
        <button class="option-btn" onclick="renderMainMenu()">
          <span class="soul-icon">❤️</span>
          <span>VOLVER AL MENÚ PRINCIPAL</span>
        </button>
      </div>
    </div>
  `;
}
