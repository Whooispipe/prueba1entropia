<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Prueba 1: Administración de Empresas</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#000000">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #000000;
      --border-color: #ffffff;
      --text-white: #ffffff;
      --ut-yellow: #ffff00;
      --ut-orange: #ff9800;
      --ut-red: #c00000;
      --soul-color: #ff0000;
      --hint-cyan: #00ffff;
      --hp-green: #00ff00;
      --sobre-azul: #64c8ff;
      --self-pink: #ff77dd;
    }

    * {
      box-sizing: border-box;
      -webkit-box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: var(--bg-color);
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      font-family: 'Press Start 2P', monospace, sans-serif;
      width: 100%;
      height: 100vh;
      height: -webkit-fill-available;
      height: 100dvh;
      height: var(--app-height, 100dvh);
      margin: 0;
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      overscroll-behavior-y: contain;
    }

    #game-container {
      width: 100%;
      max-width: 860px;
      min-height: 380px;
      background: #000;
      border: 5px solid var(--border-color);
      padding: 18px;
      position: relative;
      box-shadow: 0 0 0 3px #000, 0 0 0 6px var(--border-color);
      margin: 10px auto;
      flex-shrink: 0;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: nowrap;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 3px solid var(--border-color);
      font-size: 11px;
      gap: 8px;
      flex-shrink: 0;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .hp-container {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .hp-label {
      font-size: 10px;
      color: #fff;
    }

    .hp-bar-bg {
      width: 85px;
      height: 16px;
      background-color: var(--ut-red);
      position: relative;
      border: 1px solid #fff;
      flex-shrink: 0;
    }

    .hp-bar-fill {
      height: 100%;
      width: 100%;
      background-color: var(--ut-yellow);
      transition: width 0.2s ease-out;
    }

    .hp-num {
      font-size: 10px;
      min-width: 45px;
      text-align: right;
    }

    #muteBtn {
      flex-shrink: 0;
    }

    .progress-section {
      margin-bottom: 14px;
      font-size: 9.5px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background-color: #222;
      border: 2px solid var(--border-color);
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: var(--hint-cyan);
      transition: width 0.3s ease;
    }

    .dialogue-box {
      border: 4px solid var(--border-color);
      background: #000;
      padding: 16px;
      min-height: 90px;
      margin-bottom: 16px;
      font-size: 12px;
      line-height: 1.7;
      letter-spacing: 0.5px;
    }

    .dialogue-prefix {
      color: var(--ut-yellow);
      margin-bottom: 8px;
      display: block;
      font-size: 11px;
    }

    .hint-box {
      display: none;
      border: 2px dashed var(--hint-cyan);
      background: #041419;
      color: var(--hint-cyan);
      padding: 12px 14px;
      margin-bottom: 14px;
      font-size: 10.5px;
      line-height: 1.6;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
      width: 100%;
    }

    .option-btn {
      background: #000;
      color: #fff;
      border: 3px solid var(--border-color);
      padding: 14px 14px;
      font-family: inherit;
      font-size: 10.5px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      line-height: 1.5;
      width: 100%;
      min-height: 48px;
      transition: border-color 0.1s;
    }

    .option-btn.completed-unit {
      border-color: var(--hp-green);
      color: var(--hp-green);
    }

    .option-btn:hover, .option-btn:active, .option-btn:focus {
      border-color: var(--ut-yellow);
      color: var(--ut-yellow);
      outline: none;
    }

    .soul-icon {
      display: inline-block;
      width: 12px;
      height: 12px;
      color: var(--soul-color);
      visibility: hidden;
      font-size: 12px;
      line-height: 1;
      flex-shrink: 0;
    }

    .option-btn:hover .soul-icon,
    .option-btn:active .soul-icon,
    .action-btn:hover .soul-icon {
      visibility: visible;
    }

    .feedback-panel {
      display: none;
      border: 3px solid var(--border-color);
      padding: 12px 14px;
      margin-bottom: 14px;
      font-size: 10.5px;
      line-height: 1.6;
    }

    .feedback-panel.correct {
      border-color: #00ff00;
      color: #98ff98;
      background: #021a02;
    }

    .feedback-panel.incorrect {
      border-color: var(--ut-red);
      color: #ff8888;
      background: #1a0202;
    }

    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      border-top: 3px solid var(--border-color);
      padding-top: 14px;
    }

    .action-btn {
      background: #000;
      color: var(--ut-orange);
      border: 3px solid var(--ut-orange);
      padding: 10px 14px;
      font-family: inherit;
      font-size: 10px;
      cursor: pointer;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
    }

    .action-btn:active, .action-btn:hover {
      background: var(--ut-orange);
      color: #000;
    }

    .action-btn.hint-btn {
      color: var(--hint-cyan);
      border-color: var(--hint-cyan);
    }

    .action-btn.hint-btn:active, .action-btn.hint-btn:hover {
      background: var(--hint-cyan);
      color: #000;
    }

    .screen-overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px 4px;
    }

    .screen-title {
      font-size: 15px;
      color: var(--ut-yellow);
      margin-bottom: 14px;
      line-height: 1.6;
    }

    .menu-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 620px;
      margin-top: 14px;
    }

    .phase-badge {
      font-size: 8px;
      padding: 3px 5px;
      border: 1px solid #fff;
      color: var(--ut-yellow);
      margin-left: auto;
    }

    .phase-badge.done {
      border-color: var(--hp-green);
      color: var(--hp-green);
    }

    .save-load-row {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 620px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .save-load-btn {
      flex: 1;
      min-width: 160px;
      background: #000;
      color: #fff;
      border: 2px solid var(--border-color);
      padding: 10px 6px;
      font-family: inherit;
      font-size: 8.5px;
      cursor: pointer;
      text-transform: uppercase;
      line-height: 1.4;
    }

    .save-load-btn:hover {
      background: #222;
      border-color: var(--ut-yellow);
      color: var(--ut-yellow);
    }

    .save-load-btn.reset-btn {
      border-color: var(--ut-red);
      color: #ff8888;
    }

    .save-load-btn.reset-btn:hover {
      background: #330000;
      border-color: var(--ut-red);
      color: #ffffff;
    }

    .game-over-envelope {
      width: 130px;
      max-width: 70%;
      height: auto;
      image-rendering: pixelated;
      margin-bottom: 16px;
      filter: drop-shadow(0 0 10px rgba(100, 200, 255, 0.8));
      animation: envelopeDrop 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes envelopeDrop {
      0% { transform: translateY(-30px) scale(0.7) rotate(-10deg); opacity: 0; }
      60% { transform: translateY(6px) scale(1.08) rotate(4deg); opacity: 1; }
      100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
    }

    @media (max-width: 480px) {
      #game-container {
        padding: 12px 10px;
        border-width: 3px;
        box-shadow: 0 0 0 2px #000, 0 0 0 4px var(--border-color);
      }
      .dialogue-box {
        font-size: 10px;
        padding: 12px;
      }
      .option-btn {
        font-size: 9.5px;
        padding: 12px 10px;
      }
      .status-bar {
        font-size: 8.5px;
        gap: 4px;
      }
      .status-left {
        gap: 6px;
      }
      .hp-container {
        gap: 4px;
      }
      .hp-bar-bg {
        width: 60px;
        height: 14px;
      }
      .action-btn {
        padding: 8px 10px;
        font-size: 9px;
      }
      .screen-title {
        font-size: 13px;
      }
      .game-over-envelope {
        width: 110px;
      }
      .save-load-btn {
        font-size: 8px;
        min-width: 100%;
      }
    }

    /* =====================================================================
       FASE 9: COMPLETA LA FRASE Y PREGUNTAS DE DESARROLLO
       ===================================================================== */

    /* Los campos de texto deben permitir escribir y seleccionar (el * global lo bloquea) */
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    .topic-tag {
      display: block;
      margin-top: 6px;
      font-size: 9px;
      color: #aaa;
    }

    .blank-slot {
      display: inline-block;
      min-width: 110px;
      border-bottom: 3px solid var(--ut-yellow);
      margin: 0 4px;
      vertical-align: bottom;
    }

    .blank-filled {
      display: inline-block;
      margin: 0 3px;
      padding: 0 4px;
      color: #000;
      background: var(--hp-green);
    }

    .self-input {
      display: block;
      width: 100%;
      background: #000;
      color: #fff;
      border: 3px solid var(--border-color);
      border-radius: 0;
      padding: 14px;
      margin-bottom: 12px;
      font-family: inherit;
      font-size: 12px;
      line-height: 1.7;
      outline: none;
      caret-color: var(--ut-yellow);
      -webkit-appearance: none;
      appearance: none;
    }

    .self-input::placeholder {
      color: #666;
    }

    .self-input:focus {
      border-color: var(--ut-yellow);
    }

    .self-input[readonly] {
      border-color: #777;
      color: #ccc;
    }

    textarea.self-input {
      min-height: 190px;
      resize: vertical;
    }

    .action-btn.check-btn {
      width: 100%;
      justify-content: center;
      color: var(--self-pink);
      border-color: var(--self-pink);
      margin-bottom: 14px;
      font-size: 11px;
    }

    .action-btn.check-btn:hover,
    .action-btn.check-btn:active {
      background: var(--self-pink);
      color: #000;
    }

    .reveal-panel {
      display: none;
      border: 3px dashed var(--self-pink);
      background: #150410;
      color: #ffd6f3;
      padding: 14px;
      margin-bottom: 14px;
      font-size: 10.5px;
      line-height: 1.9;
    }

    .reveal-title {
      color: var(--self-pink);
      font-size: 10px;
      margin-bottom: 8px;
    }

    .reveal-answer {
      color: var(--hp-green);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .reveal-mine {
      color: #ddd;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .reveal-mine em {
      color: var(--ut-yellow);
      font-style: normal;
    }

    .reveal-exp {
      color: #ffd6f3;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 2px solid #4a1a40;
    }

    .reveal-model {
      color: #fff;
      line-height: 2;
    }

    .verdict {
      font-size: 10px;
      line-height: 1.7;
      margin-bottom: 6px;
    }

    .verdict.ok { color: var(--hp-green); }
    .verdict.warn { color: var(--ut-orange); }

    .key-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .key-list li {
      position: relative;
      padding-left: 18px;
      color: #ffd6f3;
    }

    .key-list li::before {
      content: "▸";
      position: absolute;
      left: 0;
      color: var(--ut-yellow);
    }

    .mark-zone {
      display: none;
      margin-bottom: 14px;
    }

    .mark-title {
      font-size: 10px;
      line-height: 1.6;
      color: var(--ut-yellow);
      margin-bottom: 10px;
    }

    .mark-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .mark-btn {
      flex: 1;
      min-width: 140px;
      min-height: 50px;
      background: #000;
      border: 3px solid;
      padding: 12px 10px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
    }

    .mark-btn.good { color: var(--hp-green); border-color: var(--hp-green); }
    .mark-btn.bad  { color: #ff6666; border-color: var(--ut-red); }

    .mark-btn.good:hover, .mark-btn.good:active, .mark-btn.good.chosen {
      background: var(--hp-green);
      color: #000;
    }

    .mark-btn.bad:hover, .mark-btn.bad:active, .mark-btn.bad.chosen {
      background: var(--ut-red);
      color: #fff;
    }

    .mark-btn:disabled {
      cursor: default;
    }

    .mark-btn:disabled:not(.chosen) {
      opacity: 0.35;
      background: #000;
    }

    .review-list {
      width: 100%;
      max-width: 620px;
      text-align: left;
      border: 3px solid var(--ut-red);
      background: #1a0202;
      padding: 12px 14px;
      margin: 6px 0 4px;
      font-size: 9.5px;
      line-height: 1.8;
      color: #ffb3b3;
    }

    .review-list .review-head {
      color: #ff6666;
      margin-bottom: 8px;
    }

    .review-list .review-item {
      padding: 8px 0;
      border-top: 2px solid #4a1010;
    }

    @media (max-width: 480px) {
      .self-input { font-size: 11px; padding: 12px; }
      .reveal-panel { font-size: 9.5px; padding: 12px; }
      .reveal-answer { font-size: 12px; }
      .mark-btn { font-size: 10px; min-width: 100%; }
      .blank-slot { min-width: 80px; }
    }
  </style>
</head>
<body>

<div id="game-container">
  <div class="status-bar" id="statusBar" style="display:none;">
    <div class="status-left">
      <span>HUMANO</span>
      <span>LV <span id="playerLV">1</span></span>
    </div>
    <div class="hp-container" id="hpContainer">
      <span class="hp-label">HP</span>
      <div class="hp-bar-bg">
        <div class="hp-bar-fill" id="hpBarFill"></div>
      </div>
      <span class="hp-num" id="hpText">1/1</span>
    </div>
    <span id="selfScore" style="display:none; font-size:10px;"></span>
    <button id="muteBtn" onclick="toggleAudio()" style="background:#000; color:#fff; border:2px solid #fff; font-family:inherit; font-size:8px; cursor:pointer; padding:5px 7px;">SONIDO: ON</button>
  </div>

  <div id="screenContent"></div>
</div>

<script>
/* =========================================================================
   0. BLINDAJE ANTI-ZOOM / ANTI-GESTOS (Safari, Chrome, WebView)
   ========================================================================= */
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('gesturechange', (e) => e.preventDefault());
document.addEventListener('gestureend', (e) => e.preventDefault());

document.addEventListener('touchmove', (e) => {
  if (e.touches && e.touches.length > 1) e.preventDefault();
}, { passive: false });

let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  const onField = e.target && e.target.closest && e.target.closest('input, textarea');
  if (now - lastTouchEnd <= 300 && !onField) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

function setRealViewportHeight() {
  document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
}
setRealViewportHeight();
window.addEventListener('resize', setRealViewportHeight);
window.addEventListener('orientationchange', setRealViewportHeight);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', setRealViewportHeight);
}

/* =========================================================================
   1. SISTEMA DE AUDIO BLINDADO
   ========================================================================= */
let audioCtx = null;
let soundEnabled = true;

function unlockAudioContext() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) {
      audioCtx = new AudioContextClass();
    }
  }
  if (audioCtx && (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted')) {
    audioCtx.resume().catch(() => {});
  }
}

['touchstart', 'touchend', 'click', 'pointerdown'].forEach(evt => {
  document.addEventListener(evt, unlockAudioContext, { passive: true, once: false });
});

function toggleAudio() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById("muteBtn");
  if (btn) btn.innerText = soundEnabled ? "SONIDO: ON" : "SONIDO: OFF";
}

function playBleep(freq = 440, type = 'square', duration = 0.05) {
  if (!soundEnabled) return;
  try {
    unlockAudioContext();
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

function playDamageSound() {
  if (!soundEnabled) return;
  try {
    unlockAudioContext();
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.25);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.25);
  } catch (e) {}
}

function playVictorySound() {
  if (!soundEnabled) return;
  const notes = [261.6, 329.6, 392.0, 523.3];
  notes.forEach((freq, idx) => {
    setTimeout(() => playBleep(freq, 'triangle', 0.16), idx * 120);
  });
}

function playGameOverSting() {
  if (!soundEnabled) return;
  const notes = [220, 207.6, 196, 185];
  notes.forEach((freq, idx) => {
    setTimeout(() => playBleep(freq, 'sawtooth', 0.32), idx * 240);
  });
}

/* =========================================================================
   2. BANCO DE PREGUNTAS (157 PREGUNTAS TOTALES 100% CALIBRADAS)
   ========================================================================= */
const MASTER_QUESTION_BANK = [
  // --- FASE 99: CERTAMEN ANTERIOR (24 PREGUNTAS INTACTAS) ---
  {
    id: 1001, phase: 99, isPastExam: true,
    q: "El benchmarking significa",
    options: [
      "Aprender de otra empresa",
      "Ninguna de las anteriores",
      "Asociarse con otra empresa",
      "Contratar trabajadores externos",
      "Vender servicio a otros países"
    ],
    ans: 0,
    hint: "No confundir con outsourcing ni joint-venture. Se orienta a evaluar y adoptar las mejores prácticas de organizaciones líderes.",
    exp: "Respuesta oficial de la pauta: Aprender de otra empresa."
  },
  {
    id: 1002, phase: 99, isPastExam: true,
    q: "\"En particular con aquellos pertenecientes al Foro APEC (países con costa al Océano Pacífico), aprovechando las fortalezas que representa para Chile el hecho de ser un país ribereño del Océano Pacífico\", en el contexto del análisis FODA esto corresponde a:",
    options: [
      "Una debilidad",
      "Una amenaza",
      "Una oportunidad",
      "Una fortaleza"
    ],
    ans: 3,
    hint: "El propio enunciado señala explícitamente que representa una condición o ventaja intrínseca que el país posee de base.",
    exp: "Respuesta oficial de la pauta: Una fortaleza."
  },

     "La sociedad en comandita reúne socios gestores (administran) y socios comanditarios (solo aportan capital)."],

    ["Una justificación fundamental para la creación de empresas públicas radica en:",
     ["Asumir rubros estratégicos o suplir la falta de inversión de los privados.",
      "Eliminar a todas las firmas privadas para instaurar un monopolio público.",
      "Impedir que los trabajadores de la industria perciban salarios en dinero.",
      "Detener la modernización de los procesos fabriles en el mercado interno."],
     "Se vincula a la seguridad nacional, recursos estratégicos y al principio de subsidiariedad del Estado.",
     "El Estado crea empresas públicas en áreas estratégicas, seguridad nacional o donde los privados no invierten."],

    ["Según el sector económico, las industrias se clasifican formalmente en:",
     ["Primarias extractivas, secundarias manufactureras y terciarias de servicio.",
      "Compañías de bolsa, cadenas comerciales de detalle y talleres mecánicos.",
      "Sociedades abiertas de capital, firmas colectivas y consorcios de crédito.",
      "Corporaciones de mando centralizado, empresas comunales y fondos mixtos."],
     "Primaria transforma naturaleza; secundaria manufactura insumos; terciaria provee servicios e intangibles.",
     "La división sectorial agrupa a firmas extractivas (primarias), transformadoras (secundarias) y de servicios (terciarias)."],

    ["En una empresa fabril, los recursos materiales cumplen la función técnica de:",
     ["Delimitar el volumen de las operaciones sin determinar el obrar humano.",
      "Dictar mecánicamente las conductas morales de los operarios de la planta.",
      "Sustituir el discernimiento de los jefes para eliminar el mando general.",
      "Establecer de forma rígida la cultura interna sin necesitar líderes guía."],
     "La capacidad instalada marca el techo físico de producción, pero las personas deciden y gestionan la firma.",
     "Los activos materiales fijan los límites operativos, pero las personas determinan la acción concreta de la empresa."],

    ["La práctica comercial y financiera del 'Arbitraje de Bienes' se define técnicamente como:",
     ["Comprar un bien donde cotiza bajo para venderlo donde su precio es mayor.",
      "Pactar precios con rivales de la industria para anular la libre competencia.",
      "Adquirir activos productivos en remates fiscales con rebajas arancelarias.",
      "Externalizar faenas de manufactura pesada en talleres tercerizados foráneos."],
     "Consiste en aprovechar las discrepancias geográficas o temporales de precios entre dos plazas comerciales distintas.",
     "El arbitraje consiste en comprar en un mercado a precio bajo y revender en otro mercado más caro obteniendo una ganancia neta libre."],

    ["En la administración de operaciones fabriles y de servicios, el 'Layout' comprende:",
     ["La distribución física y espacial de áreas, puestos de trabajo y equipos.",
      "El catálogo contable donde se liquidan las remuneraciones de los obreros.",
      "El sistema informático que detecta ataques de denegación en la red web.",
      "El balance impositivo anual remitido a las tesorerías públicas del país."],
     "Se refiere al diseño de la planta: cómo se ubican físicamente las máquinas, pasillos y estaciones de servicio para maximizar la eficiencia.",
     "El layout es el diseño y distribución espacial estratégica de maquinaria, áreas de trabajo y estaciones de servicio."]
  ],

  2: [ // PROBLEMA ADMINISTRATIVO, HABILIDADES, IE, MERCADO LABORAL E INNOVACIÓN (23 PREGUNTAS)
    ["El 'problema administrativo' surge necesariamente en toda organización donde:",
     ["Hay al menos dos personas en pos de un fin común que exige coordinación.",
      "Se carece por completo de fondos bancarios para solventar inversiones.",
      "Las leyes del Estado obligan a prescindir de supervisores de planta.",
      "Los precios de venta superan a los costos generando ganancias brutas."],
     "Surge dondequiera que dos o más personas deben unir esfuerzos y recursos hacia un objetivo compartido.",
     "Donde hay cooperación organizada hacia un fin común, surge el problema de coordinar personas y recursos."],

    ["Se afirma que la administración es una ciencia social debido a que:",
     ["Aplica métodos de observación sistemática para explicar la realidad fabril.",
      "Formula teoremas matemáticos infalibles que predicen balances exactos.",
      "Prescinde del factor humano apoyándose en algoritmos computacionales.",
      "Aplica normativas jurídicas rígidas que no admiten ningún juicio libre."],
     "Toda ciencia social posee marcos teóricos y métodos para estudiar y prever el comportamiento humano en organizaciones.",
     "Es ciencia social porque estudia y explica sistemáticamente la conducta organizada mediante principios."],

    ["La administración es considerada un 'arte' en la teoría directiva porque:",
     ["Exige el saber aplicar con destreza las teorías para lograr buenos fines.",
      "Depende de la inspiración estética de los diseñadores de la compañía.",
      "Rechaza el método científico confiando en impulsos ciegos del directivo.",
      "Se limita a la ornamentación visual de las dependencias de la fábrica."],
     "El arte es la sabiduría práctica: saber cómo traducir conceptos abstractos en resultados exitosos reales.",
     "Es arte porque requiere la habilidad y sabiduría práctica para aplicar los principios a situaciones concretas."],

    ["La tarea medular de la administración en toda organización moderna consiste en:",
     ["Transformar metas en acción coordinando esfuerzos de planeación y control.",
      "Llevar libros de contabilidad conforme a requerimientos fiscales del país.",
      "Reemplazar a los operarios mediante brazos mecánicos de última tecnología.",
      "Custodiar el capital financiero de los dueños eludiendo riesgos del medio."],
     "Interpretar los objetivos organizacionales y movilizar personas y recursos para alcanzarlos eficazmente.",
     "La tarea administrativa transforma metas en acción mediante planeación, organización, dirección y control."],

    ["El propósito esencial del trabajo del administrador en la empresa es:",
     ["Proyectar a la organización desde su situación actual a una futura mejor.",
      "Preservar las rutinas fabriles inalterables sin admitir ninguna variante.",
      "Asegurar que ningún plan estratégico deba ser revisado en el ejercicio.",
      "Disminuir la nómina laboral al mínimo posible en cada balance contable."],
     "Tender un puente entre el diagnóstico de dónde estamos hoy y la visión de dónde queremos llegar mañana.",
     "El trabajo del administrador consiste en conducir a la firma desde su presente hacia un estado relativamente mejor."],

    ["La habilidad técnica del administrador se refiere fundamentalmente a:",
     ["El dominio de métodos, procesos, herramientas y técnicas de una faena.",
      "La capacidad para comprender a la compañía como un todo interconectado.",
      "El discernimiento psicológico para liderar y motivar a los empleados.",
      "La intuición comercial para adivinar las variaciones del mercado libre."],
     "Es la destreza práctica con las 'herramientas del oficio', indispensable en la base operativa y supervisión.",
     "La habilidad técnica involucra el manejo experto de métodos, procesos y equipos propios de la especialidad."],

    ["La habilidad humana en el ejercicio del mando directivo se define como:",
     ["El discernimiento para trabajar con personas, comprenderlas y guiarlas.",
      "El saber especializado sobre el funcionamiento de motores en las naves.",
      "El cálculo matemático de presupuestos de caja para la gerencia general.",
      "La capacidad de trazar organigramas formales para las dependencias altas."],
     "Trato interpersonal, empatía, motivación y liderazgo: saber hacer las cosas con y a través de la gente.",
     "La habilidad humana implica trabajar cooperativamente con personas, entendiendo sus motivaciones y liderándolas."],

    ["La habilidad conceptual capacita al administrador principalmente para:",
     ["Comprender a la firma como un todo y alinear áreas hacia metas globales.",
      "Manejar maquinarias de montaje y solucionar desperfectos en los talleres.",
      "Registrar transacciones en libros de contabilidad al cierre del período.",
      "Controlar asistencias y marcar tarjetas en los portones de las plantas."],
     "Visión panorámica y estratégica: cómo encajan todas las piezas de la empresa en el entorno general.",
     "La habilidad conceptual permite percibir a la firma sistémicamente y tomar decisiones estratégicas globales."],

    ["Según Daniel Goleman, la inteligencia emocional se estructura sobre facultades como:",
     ["Autoconocimiento, autorregulación, motivación, empatía y destreza social.",
      "Cálculo matemático avanzado, memoria enciclopédica y deducción analítica.",
      "Habilidad manual mecánica, resistencia muscular y reflejos en la faena.",
      "Conocimiento de leyes tributarias, auditoría contable y peritaje legal."],
     "Las 5 dimensiones clave: conocerse a sí mismo, gobernarse, empuje personal, conectar con otros y crear redes.",
     "Goleman postula 5 dimensiones esenciales de la IE: autoconocimiento, autorregulación, motivación, empatía y habilidad social."],

    ["El corolario sobre inteligencia emocional establece que una elevada IE por sí sola:",
     ["No garantiza aptitudes laborales aprendidas, sino el potencial para ello.",
      "Asegura el éxito comercial inmediato prescindiendo de toda capacitación.",
      "Sustituye por completo al conocimiento técnico y a la experiencia fabril.",
      "Hace imposible que un directivo se equivoque en la gestión de personas."],
     "Tener talento en potencia no equivale a haber desarrollado las competencias profesionales concretas en el trabajo.",
     "La IE mide el potencial; la aptitud emocional muestra qué parte de ese potencial se transformó en competencia real."],

    ["La 'Pericia' profesional según Daniel Goleman se forma mediante la convergencia de:",
     ["El sentido común sumado a conocimientos técnicos y a una práctica asidua.",
      "Un elevado coeficiente intelectual heredado genéticamente en el hogar.",
      "Títulos académicos acumulados sin requerir experiencia laboral previa.",
      "Instrucciones de manuales rígidos aplicadas sin ningún margen de juicio."],
     "No basta con la teoría: se requiere el juicio práctico que se pule con años de trabajo en el terreno real.",
     "Goleman define la pericia como la mezcla de sentido común, conocimiento especializado y práctica acumulada."],

    ["En el estudio del BID en Chile sobre empleo, los reclutadores priorizan:",
     ["Habilidades socioemocionales de responsabilidad, honestidad y trabajo.",
      "Saberes ultra específicos del rubro por sobre actitudes interpersonales.",
      "Dominio de matemáticas puras y memorización de reglamentos mercantiles.",
      "Títulos académicos formales por sobre el trato comunicativo y honesto."],
     "Marina Bassi destacó que si un joven no sabe comunicarse, ser honesto o trabajar en equipo, fracasa de inmediato.",
     "Los empleadores chilenos valoran primordialmente las actitudes y habilidades blandas por encima del saber específico de nicho."],

    ["Respecto a los conocimientos específicos del rubro, el estudio del BID concluyó que:",
     ["Son los atributos menos valorados, pues la firma puede enseñarlos luego.",
      "Son el filtro excluyente primordial sin importar la actitud del sujeto.",
      "Garantizan el ascenso inmediato a puestos de directores en las plantas.",
      "Superan en importancia a la honradez y a la capacidad comunicativa oral."],
     "Las empresas prefieren capacitar en lo técnico a alguien honesto y receptivo que lidiar con alguien conflictivo pero experto.",
     "El conocimiento del rubro es lo que menos preocupa a los reclutadores, ya que es entrenable si hay base socioemocional."],

    ["En el Índice de Actitud Innovadora y Emprendedora en Chile, el atributo más alto fue:",
     ["La perseverancia, que impulsa a no rendirse y asumir reveses como lección.",
      "La aversión al riesgo, que paraliza decisiones ante la incertidumbre.",
      "La desconfianza en el entorno, que frena acuerdos comerciales mutuos.",
      "El individualismo caótico, que busca ganancias sin formar sociedades."],
     "Superó el 85%-88%: la capacidad de insistir con resiliencia ante las dificultades del mercado.",
     "La perseverancia/resiliencia fue la cualidad con mayor porcentaje en los emprendedores chilenos medidos por el índice."],

    ["La resiliencia en los emprendedores chilenos se manifiesta operativamente como:",
     ["Ver tropiezos como instancias de aprendizaje y buscar vías de solución.",
      "Abandonar el negocio al primer percance para no asumir deudas futuras.",
      "Traspasar las pérdidas operativas hacia subsidios estatales de ayuda.",
      "Imponer precios de monopolio para recuperar fondos sin elevar calidad."],
     "Prosigue con determinación ante la adversidad, transformando los errores en experiencia constructiva.",
     "Para el emprendedor perseverante no hay fracaso terminal, sino instancias de aprendizaje para resolver problemas."],

    ["Entre las habilidades cognitivas requeridas en Chile, los empleadores destacan:",
     ["La comunicación y el lenguaje oral por sobre matemáticas, salvo en banca.",
      "El cálculo actuarial avanzado por encima de la capacidad de redacción.",
      "El dominio de idiomas clásicos antiguos por sobre el trato comercial.",
      "La memorización de fórmulas físicas por sobre la atención a clientes."],
     "Saber escuchar, darse a entender oralmente y redactar con claridad supera al rigor matemático en la mayoría de rubros.",
     "La comunicación y lenguaje son las destrezas cognitivas más buscadas, superando al cálculo matemático general."],

    ["Al ascender desde la supervisión operativa hacia la gerencia general de una firma:",
     ["La destreza técnica disminuye su peso y la habilidad conceptual se eleva.",
      "La habilidad técnica pasa a ser la única herramienta calificada formal.",
      "Las relaciones interpersonales dejan de importar frente a las máquinas.",
      "La habilidad conceptual desaparece para dar paso a la faena del taller."],
     "El jefe de taller necesita técnica; el director corporativo necesita ver el bosque completo (conceptual).",
     "Conforme se escala en la pirámide, la técnica cede protagonismo ante la visión conceptual global."],

    ["En el análisis FODA de una empresa, el entorno externo se diagnostica evaluando:",
     ["Oportunidades del mercado y amenazas que provienen de los competidores.",
      "Fortalezas de los trabajadores y fallas operativas de la maquinaria.",
      "Políticas de sueldos internos y manuales de procedimiento de oficinas.",
      "Fallas de mantención en plantas y problemas salariales del sindicato."],
     "Variables no controlables directamente por la firma que vienen de la industria o la macroeconomía.",
     "El entorno externo se compone de Oportunidades y Amenazas (analizadas con Porter o PEST)."],

    ["El diagnóstico del medio interno en el análisis FODA busca evaluar rigurosamente:",
     ["Fortalezas y debilidades de recursos que la propia firma puede gobernar.",
      "Variaciones en tasas de interés bancarias e impuestos fijados por ley.",
      "Tratados de libre comercio mundiales y tratados arancelarios del Asia.",
      "Tendencias demográficas de la población y alteraciones del clima local."],
     "Factores propios sobre los que la administración sí tiene gobernanza y control (Cadena de Valor).",
     "El medio interno examina Fortalezas y Debilidades controlables de la propia compañía."],

    ["El supuesto clásico del 'Homo Economicus' asumido por Taylor consideraba al obrero:",
     ["Un ente racional motivado esencialmente por incentivos salariales directos.",
      "Un ser gregario guiado por el afecto y la pertenencia a un grupo humano.",
      "Un colaborador ético guiado por ideales de trascendencia en el empleo.",
      "Un operario autónomo que desprecia cualquier clase de estímulo en dinero."],
     "La idea de que el trabajador acude a la fábrica únicamente para ganar dinero proporcional a su esfuerzo físico.",
     "Taylor y los primeros teóricos clásicos concebían al obrero motivado casi únicamente por recompensas pecuniarias."],

    ["La esencia del liderazgo ejercido a través de la aptitud emocional reside en:",
     ["Lograr que los colaboradores cumplan su labor con efectividad y talento.",
      "Ejecutar personalmente todas las labores operativas de las dependencias.",
      "Impedir que los trabajadores tomen decisiones autónomas en sus faenas.",
      "Sustituir los planes de la firma por órdenes verbales sin discusión."],
     "Hacer las cosas a través de las personas, canalizando sus aptitudes para potenciar el desempeño colectivo.",
     "Liderar es aprovechar el talento humano para que los equipos alcancen resultados de excelencia."],

    ["En los procesos de innovación ejecutiva, el 'Pensamiento Inductivo' se distingue porque:",
     ["Busca incorporar tecnologías emergentes para elevar la productividad.",
      "Rastrea herramientas técnicas puntuales para resolver una falla previa.",
      "Aplica deducciones lógicas teóricas descartando la experimentación fabril.",
      "Suprime los procesos automatizados para sostener el trabajo tradicional."],
     "El deductivo parte de un problema conocido y busca la herramienta. El inductivo mira las nuevas tecnologías y piensa: ¿cómo las aprovechamos para rendir más?",
     "En innovación, el pensamiento inductivo busca cómo incorporar nuevas tecnologías para potenciar la productividad general."],

    ["En el marco de la relación recíproca entre sociedad y empresa, esta última exige a la sociedad:",
     ["Seguridad pública, preferencia de compra, impuestos justos y cuidar bienes.",
      "Subsidios permanentes de caja que cubran la totalidad de pérdidas operativas.",
      "La prohibición absoluta de sindicatos obreros en todas las líneas fabriles.",
      "Fijar precios monopolistas por decreto legal para asegurar alta rentabilidad."],
     "La sociedad pide trabajo, eficacia y valores; la firma pide a cambio un entorno seguro, tributación justa, preferencia y cuidado de sus recursos.",
     "La empresa demanda a la sociedad seguridad pública, preferencia por su producto, cuidado de recursos e impuestos justos."]
  ],

  3: [ // ESCUELAS CLÁSICAS: TAYLOR Y FAYOL (21 PREGUNTAS)
    ["La principal preocupación de Frederick Taylor al publicar su obra en 1911 fue:",
     ["Elevar la eficiencia productiva reduciendo costos y pagando sueldos justos.",
      "Diseñar la arquitectura corporativa de directores en empresas europeas.",
      "Incentivar la sindicalización obrera para repartir utilidades de caja.",
      "Escribir manuales de contabilidad para bancos comerciales de occidente."],
     "Eficiencia fabril: combatir el derroche de recursos y recompensar el esfuerzo obrero según productividad.",
     "Taylor buscaba aumentar la productividad de la producción disminuyendo mermas y premiando el rendimiento."],

    ["El primer principio de Frederick Taylor postula la necesidad formal de:",
     ["Sustituir las reglas prácticas por la ciencia del conocimiento ordenado.",
      "Fomentar el empirismo tradicional de los operarios antiguos en talleres.",
      "Suprimir los cronometrajes de tareas para dar plena libertad de acción.",
      "Delegar la planificación de los turnos en aprendices novatos de planta."],
     "Desterrar la improvisación del taller mediante métodos científicos estudiados y estandarizados.",
     "Taylor propone reemplazar la rutina empírica por conocimiento científico organizado."],

    ["En la administración científica de Taylor, el segundo principio busca:",
     ["Obtener armonía en lugar de discordia en la acción coordinada de grupos.",
      "Incentivar la confrontación permanente entre obreros y jefes de planta.",
      "Dispersar cuadrillas permitiendo el desorden operacional en las naves.",
      "Reducir la producción fabril para sostener altos precios de las piezas."],
     "Superar el conflicto capital-trabajo creando intereses compartidos de prosperidad común.",
     "Taylor promovía la armonía y concordia grupal en reemplazo de la discordia."],

    ["El tercer principio de Frederick Taylor exhorta a la administración a:",
     ["Lograr la cooperación humana en vez de sostener un individualismo caótico.",
      "Estimular el aislamiento de cada operario en casetas cerradas de faena.",
      "Premiar el desorden fabril cuando ahorre fondos en lubricantes de motor.",
      "Suprimir jefaturas intermedias para que las cuadrillas operen sin guía."],
     "Colaboración armónica y deliberada frente a la anarquía individualista en los talleres.",
     "Se busca la cooperación activa entre administración y operarios para maximizar la producción."],

    ["Respecto al volumen de trabajo, el cuarto principio de Taylor establece:",
     ["Trabajar en busca de la producción máxima en vez de producción limitada.",
      "Frenar piezas por hora para no saturar almacenes de piezas terminadas.",
      "Bajar la velocidad de tornos para nivelar hacia abajo el esfuerzo fabril.",
      "Elaborar solo por encargo semanal sin acumular existencias de seguridad."],
     "Combatir la 'holgazanería sistemática' produciendo al tope del potencial científico medido.",
     "Taylor promovía la producción máxima y combatía la restricción deliberada del rendimiento."],

    ["El quinto principio de Frederick Taylor se orienta directamente a:",
     ["Desarrollar a cada trabajador al grado más alto para su mutuo beneficio.",
      "Mantener a operarios en tareas rutinarias sin otorgar perfeccionamiento.",
      "Despedir periódicamente al personal experto para contratar mano barata.",
      "Exigir jornadas agotadoras sin evaluar el desgaste corporal del obrero."],
     "Entrenar y capacitar al trabajador para que logre su máxima eficiencia y gane el mejor salario.",
     "Desarrollar al máximo el potencial de cada trabajador para beneficio mutuo de la empresa y del operario."],

    ["El método central empleado por Taylor para racionalizar las faenas obreras fue:",
     ["El estudio de tiempos y movimientos cronometrando la labor en el taller.",
      "La aplicación de encuestas psicológicas sobre bienestar en los turnos.",
      "La negociación de contratos en asambleas paritarias de los sindicatos.",
      "El análisis contable de los balances financieros de la gerencia alta."],
     "Descomponer cada labor fabril en movimientos elementales y medir con cronómetro la forma óptima.",
     "El cronometraje y análisis de movimientos permitió fijar estándares científicos de ejecución."],

    ["El sistema de 'pago a trato' o destajo propuesto por Taylor buscaba:",
     ["Recompensar al operario en función directa de su productividad en piezas.",
      "Asegurar un sueldo idéntico para todos con independencia del esfuerzo.",
      "Entregar acciones de la empresa como parte del salario mensual pagado.",
      "Financiar seguros médicos privados para la totalidad del grupo obrero."],
     "Taylor consideraba que el salario fijo promovía la simulación de trabajo; al pagar por pieza, premiaba el mérito real.",
     "El salario por pieza producida alinea el interés económico del obrero con la eficiencia productiva de la fábrica."],

    ["Taylor concibió al obrero en las líneas fabriles bajo el modelo de:",
     ["Un hombre-máquina motivado casi solo por incentivos económicos directos.",
      "Un líder integrador guiado por preservar la armonía social de su grupo.",
      "Un colaborador con visión amplia sobre la conducción del negocio fabril.",
      "Un artesano que rechaza el dinero prefiriendo la libertad en su puesto."],
     "La escuela clásica temprana asumió que el obrero era un engranaje fisiológico regulable de la línea.",
     "Taylor adoptó la visión mecanicista del 'Homo Economicus', regulando energía gastada a cambio de dinero."],

    ["Una diferencia metodológica sustancial entre Fayol y Taylor radica en que:",
     ["Fayol miró la firma desde la alta dirección y Taylor desde el taller base.",
      "Taylor diseñó la estructura general y Fayol se limitó a medir tiempos.",
      "Fayol rechazó la división del trabajo y Taylor defendió las jerarquías.",
      "Ambos autores descartaron la necesidad de aplicar ciencia a la gestión."],
     "Taylor fue 'bottom-up' (del taller hacia arriba); Fayol fue 'top-down' (desde la gerencia general).",
     "Taylor partió del taller y la producción; Fayol partió de la gerencia general y la estructura corporativa."],

    ["Henri Fayol estructuró el proceso administrativo general en cinco actos clave:",
     ["Planear, organizar, dirigir, coordinar y controlar las funciones de área.",
      "Comprar, fabricar, vender, almacenar y cobrar las piezas de los pedidos.",
      "Contratar, sancionar, despedir, capacitar y reubicar al personal fabril.",
      "Diagnosticar, cotizar, presupuestar, endeudarse y liquidar aranceles hoy."],
     "PODCC: prever/planear, organizar, mandar/dirigir, coordinar y controlar.",
     "Fayol definió los 5 elementos del proceso administrativo universal."],

    ["Las seis funciones que componen la totalidad de una empresa según Fayol son:",
     ["Técnicas, comerciales, financieras, seguridad, contables y directivas.",
      "De compras, de inventario, de transporte, de almacenaje, venta y cobro.",
      "De jefaturas altas, mandos medios, supervisores, capataces y aprendices.",
      "De diagnóstico FODA, formulación de metas, presupuestos y auditorías."],
     "Producción, compras/ventas, gestión de dinero, protección de bienes, balances y la coordinación superior.",
     "Fayol agrupó todas las operaciones empresariales en 6 funciones operativas e integradoras."],

    ["El principio de 'División del Trabajo' enunciado por Fayol persigue:",
     ["Especializar tareas técnicas y administrativas para elevar la eficiencia.",

    ["En la doctrina fayoliana, la relación entre autoridad y responsabilidad dicta que:",

    ["Fayol define la 'Disciplina' en las organizaciones como:",

     "Requiere buenos superiores en todos los niveles y acuerdos claros cumplidos por ambas partes.",

    ["El principio fayoliano de 'Unidad de Mando' establece textualmente que:",

    ["La diferencia entre 'Unidad de Mando' y 'Unidad de Dirección' en Fayol es:",

     "Unidad de mando: un empleado = un jefe. Unidad de dirección: un grupo de actividades con el mismo objetivo = un jefe y un plan.",

    ["El principio de 'Subordinación del interés particular al general' dicta que:",

     "Cuando surgen diferencias entre la conveniencia personal y la salud colectiva de la compañía, la gerencia debe conciliar.",

    ["Respecto a la 'Remuneración', Henri Fayol postulaba que los pagos deben:",

     "Fayol exige justicia en las tarifas para premiar el esfuerzo de forma equilibrada para ambas partes."],

    ["El principio de 'Cadena Escalar' en la estructura de Fayol representa:",

    ["Los principios de 'Orden' y 'Equidad' enunciados por Fayol exigen:",

  4: [ // PLANIFICACIÓN EMPRESARIAL Y PDEI PUCV 2023-2029 (21 PREGUNTAS)
    ["En la teoría administrativa general, planificar se define técnicamente como:",
     ["Decidir de antemano qué hacer, cómo, cuándo, con qué recursos y quién.",
      "Auditar balances contables para detectar fraudes del ejercicio anterior.",
      "Improvisar cursos de acción sobre la marcha según la contingencia diaria.",
      "Supervisar las líneas de armado fabril mediante cronómetros de taller."],
     "Decidir participar activamente en el futuro: tender un puente desde donde estamos hacia donde queremos llegar.",
     "Planificar es anticipar cursos de acción escogiendo objetivos, recursos, métodos y responsables."],

    ["La formulación de planes empresariales se apoya en supuestos construidos:",
     ["Sobre variables cuantitativas (precios) y cualitativas de todo el entorno.",
      "Exclusivamente sobre corazonadas subjetivas del director corporativo.",
      "Únicamente sobre normativas legales que emanan de ministerios del país.",
      "Prescindiendo de proyecciones futuras para basarse en el pasado fabril."],
     "Premisas cuantitativas (caja, consumo de insumos, horas) y cualitativas (imagen de marca, clima social).",
     "Los planes descansan en premisas de escenarios optimistas, normales o pesimistas cuantitativos y cualitativos."],

    ["En la tipología de planes, la 'Visión' corporativa se diferencia de la 'Misión' en que:",
     ["La visión proyecta sueños en acción a futuro; la misión el rol de hoy.",
      "La visión es un presupuesto numérico; la misión una regla disciplinaria.",
      "La misión fija cronogramas de faena; la visión es un plan de publicidad.",
      "La visión abarca solo auditorías legales; la misión el reparto de fondos."],
     "Visión: dónde queremos estar y qué soñamos ser. Misión: qué hacemos, a quién servimos y nuestros valores esenciales hoy.",
     "La visión encarna la aspiración futura puesta en acción; la misión explicita la razón de ser actual."],

    ["Los 'Objetivos' y 'Metas' en la planificación se caracterizan por ser:",
     ["Fines concretos o medibles que se persiguen en plazos preestablecidos.",
      "Enunciados ambiguos de deseos que no comprometen fechas de cumplimiento.",
      "Reglas inflexibles que anulan toda discrecionalidad en faenas de planta.",
      "Cálculos matemáticos usados únicamente para estimar el desgaste fabril."],
     "Son los blancos o fines a los que se dirigen las actividades organizacionales, delimitados en el tiempo.",
     "Los objetivos y metas orientan la acción organizacional con plazos y compromisos concretos."],

    ["La diferencia fundamental entre una 'Política' y una 'Regla' radica en que:",
     ["La política orienta el criterio al decidir; la regla manda sin excepción.",
      "La política es de cumplimiento ciego; la regla es una sugerencia libre.",
      "La regla contiene cifras de dinero; la política es un método de tiempos.",
      "La política solo rige para obreros; la regla para el directorio corporativo."],
     "Las políticas permiten margen de juicio interpretativo; las reglas no admiten discrecionalidad alguna.",
     "Las políticas encauzan el pensamiento; las reglas dictan acciones específicas obligatorias u omitidas."],

    ["Los 'Procedimientos' en la tipología formal de planes son definidos como:",
     ["Planes que fijan la secuencia cronológica y el método para cumplir tareas.",
      "Asignaciones cuantitativas de recursos para un proyecto extraordinario.",
      "Mandatos terminales que impiden cualquier acción dudosa en los talleres.",
      "Directrices generales que orientan el pensamiento ético de los gerentes."],
     "A diferencia de las políticas, los procedimientos son guías paso a paso cronológicas y detalladas.",
     "Los procedimientos establecen el método y la secuencia cronológica requerida para ejecutar actividades rutinarias."],

    ["Un 'Presupuesto' se diferencia de un programa organizacional en que:",
     ["Es una formulación de resultados esperados en puros términos numéricos.",
      "Carece de cifras de dinero formulando solo declaraciones cualitativas.",
      "Detalla tareas operativas sin asignar partidas contables a los mandos.",
      "Prescinde de plazos temporales para medir el rendimiento de los proyectos."],
     "Mientras un programa detalla tareas y responsables, este plan traduce todo a cifras monetarias, cantidades u horas.",
     "El presupuesto es la cuantificación numérica anticipada de los resultados esperados y recursos asignados."],

    ["El principio de 'Prevalencia de la Planeación' establece claramente que:",
     ["Planificar antecede y fundamenta a las demás funciones administrativas.",
      "Organizar resulta siempre prioritario frente al acto de fijar objetivos.",
      "El control posterior sustituye por completo a los planes ya elaborados.",
      "La dirección general solo debe planificar cuando sobrevengan desastres."],
     "No se puede organizar al personal, dirigir tareas ni controlar desviaciones si antes no se han establecido metas y planes.",
     "La planeación es la función primordial y previa a la ejecución de organizar, dirigir y controlar."],

    ["El principio de 'Extensión de la Planeación' postula en la administración que:",
     ["Planificar es función de todo administrador, según su ámbito de mando.",
      "Solo planifica el gerente general excluyendo a jefaturas intermedias.",
      "La planificación debe extenderse indefinidamente sin fijar horizontes.",
      "Los programas de corto plazo deben anular planes corporativos futuros."],
     "Desde el supervisor de primera línea hasta el presidente corporativo: todos planifican, aunque cambie la amplitud.",
     "Planear compete a todos los niveles de administración según la autoridad delegada."],

    ["El 'Principio de Flexibilidad' en la elaboración de planes exige que:",
     ["Se imprima facilidad de adaptación minimizando pérdidas por imprevistos.",
      "Los planes se mantengan completamente rígidos para evitar desvíos reales.",
      "La flexibilidad no considere costos de oportunidad en sus compromisos.",
      "Se cambie de giro de negocio apenas aparezca una complicación menor hoy."],
     "Capacidad de adaptarse ante eventos inesperados evaluando el costo de oportunidad frente a los compromisos contraídos.",
     "La flexibilidad reduce pérdidas ante imprevistos, modulando riesgos versus promesas de valor."],

    ["El 'Principio del Cambio de Rumbo' impone al administrador la obligación de:",
     ["Auditar el entorno periódicamente y rediseñar planes para cumplir metas.",
      "Alterar los objetivos básicos cada vez que un competidor lance ofertas.",
      "Conservar los programas inalterables ante variaciones graves del sector.",
      "Reemplazar a las jefaturas de taller apenas surja un leve retraso fabril."],
     "Los planes no son rígidos: si las premisas cambian, el directivo debe recalibrar el camino para asegurar el fin.",
     "Este principio señala que mientras más a largo plazo sean las decisiones, más necesario es auditar la marcha y ajustar la ruta."],

    ["El principio de 'Compromiso' en la planificación estratégica indica que:",
     ["El horizonte del plan debe cubrir el lapso para amortizar decisiones.",
      "Los empleados deben firmar un pacto formal de sumisión a la gerencia.",
      "Los planes aprobados deben vencer invariablemente a los doce meses hoy.",
      "El presupuesto financiero fijado no admite cambios bajo ninguna causa."],
     "El plazo de un plan no puede ser arbitrario: debe ser lo suficientemente extenso para respaldar y recuperar el capital invertido.",
     "El principio de compromiso postula que el horizonte de planificación debe asegurar el cumplimiento y amortización de las decisiones."],

    ["El 'Diagnóstico' dentro de la planificación estratégica cumple la función de:",
     ["Reducir la incertidumbre sobre el futuro para orientar mejor las decisiones.",
      "Reemplazar por completo la necesidad de definir visión y misión previas.",
      "Fijar de antemano las metas sin revisar el entorno externo ni el interno.",
      "Suprimir la etapa de formulación de objetivos dentro del plan de acción."],
     "Es el punto de partida de la planificación: entender dónde está la empresa hoy antes de decidir hacia dónde ir, típicamente mediante un análisis FODA.",
     "El diagnóstico reduce la incertidumbre y orienta las decisiones con base en una visión más clara del entorno."],

    ["Los 'Planes Funcionales' de una empresa corresponden a:",
     ["Los planes específicos de áreas como marketing, presupuesto, finanzas e inversiones.",
      "Un único plan maestro que reemplaza la necesidad de planificar por área.",
      "Documentos exclusivamente contables sin relación con la estrategia general.",
      "Reglamentos internos de disciplina que no se vinculan a objetivos de la firma."],
     "La planificación no se limita a una sola área de la empresa.",
     "La planificación estratégica involucra distintos planes funcionales como marketing, presupuesto, finanzas e inversiones."],

    ["El concepto de 'Ventaja Competitiva' en la planificación estratégica se entiende como:",
     ["Obtener una rentabilidad superior al costo del capital invertido en el negocio.",
      "Igualar exactamente el costo del capital para evitar pérdidas contables.",
      "Depender únicamente del precio más bajo del mercado para vender más.",
      "Prescindir de toda inversión para minimizar el riesgo financiero de la firma."],
     "Una inversión debe rendir por encima de lo que cuesta el capital, para no limitarse a sobrevivir en el umbral mínimo.",
     "La ventaja competitiva se asocia a obtener rentabilidad superior al costo del capital."],

    ["La secuencia lógica del proceso de gestión estratégica se ordena como:",
     ["Diagnóstico, Supuesto, Objetivo y Estrategia.",
      "Estrategia, Objetivo, Supuesto y Diagnóstico.",
      "Objetivo, Estrategia, Diagnóstico y Supuesto.",
      "Supuesto, Diagnóstico, Estrategia y Objetivo."],
     "Primero se diagnostica la situación, luego se formulan los supuestos, después se declaran los objetivos y finalmente se elige la estrategia para alcanzarlos.",
     "El proceso de gestión estratégica sigue la secuencia Diagnóstico–Supuesto–Objetivo–Estrategia."],

    ["La 'Organización Formal' se define en la planificación empresarial como:",
     ["La coordinación de dos o más personas para lograr el proceso de planificación.",
      "Un grupo informal de trabajadores sin ningún vínculo con los objetivos de la firma.",
      "La suma de bienes materiales que posee la empresa para operar cada día.",
      "El conjunto de normas legales que rigen a la empresa frente al Estado."],
     "Se requiere que dos o más personas estén coordinadas para lograr el proceso de planificación.",
     "La organización formal existe cuando dos o más personas están coordinadas para lograr el proceso de planificación."],

    ["El 'Organigrama' de una empresa se entiende principalmente como:",
     ["La representación formal de la estructura organizacional y sus funciones.",
      "Un documento exclusivamente financiero sin relación con la estructura de mando.",
      "Un registro histórico de las utilidades obtenidas en ejercicios anteriores.",
      "Una lista de proveedores externos ordenados según su volumen de venta."],
     "Se relaciona la organización con la definición de funciones, recursos y canales de comunicación.",
     "El organigrama representa formalmente la estructura de la organización, sus funciones y canales de comunicación."],

    ["La diferencia entre 'Macroplanificación' y 'Microplanificación' institucional radica en que:",
     ["La macroplanificación es a nivel de toda la institución y la microplanificación es de cada unidad.",
      "Ambas son idénticas y se aplican indistintamente a cualquier nivel de la firma.",

     "Ambas formas de planificación deben mantener coherencia entre sí, aunque operen en niveles distintos.",
     "La macroplanificación institucional y la microplanificación de cada unidad deben mantener coherencia entre sí."],

    ["Dentro del 'Control' de la planificación estratégica, se distinguen:",
     ["El control operacional y el control de gestión.",
      "El control salarial y el control disciplinario únicamente.",
      "Un solo tipo de control, aplicado exclusivamente al área contable.",
      "El control externo del Estado como única forma de fiscalización."],
     "El control permite evaluar si lo planificado realmente se está cumpliendo.",
     "Existen dos tipos de control en la planificación estratégica: el control operacional y el control de gestión."],

    ["Antes de definir la dirección de una empresa, el proceso de planificación exige:",
     ["Especificar las aptitudes y habilidades de las posibles personas a incorporar.",
      "Omitir por completo la revisión de perfiles antes de asignar jefaturas.",

      "Delegar la selección de personal a una entidad totalmente ajena a la firma."],
     "Se debe especificar las aptitudes y habilidades de las posibles personas antes de especificar la dirección de la empresa, es decir, las jefaturas.",
     "El ciclo de planificación primero especifica aptitudes y habilidades del personal y luego define la dirección o jefaturas de la empresa."]

  5: [ // ESTRATEGIA COMPETITIVA Y MICHAEL PORTER (21 PREGUNTAS)
    ["El concepto de 'Estrategia' se define formalmente en la administración como:",
     ["Un patrón de decisiones coherente, unificador e integrador de la firma.",
      "Una lista de precios rebajados para liquidar mercancías de vieja data.",
      "Un organigrama visual que muestra cargos y jefaturas departamentales.",
      "Un reglamento interno que prohíbe acciones operativas a los obreros."],
     "Marco integrador que define el rumbo de largo plazo, asigna recursos y construye ventajas competitivas sostenibles.",
     "La estrategia es un patrón integral de decisiones que define objetivos a largo plazo y asigna recursos para crear ventajas."],

    ["En la planificación estratégica, las decisiones a nivel 'Corporativo' abarcan:",
     ["Determinaciones de máximo alcance que engloban la totalidad de la firma.",
      "Programas funcionales de selección y pago de honorarios a operarios.",
      "Campañas publicitarias de una tienda puntual dentro de una provincia.",
      "La calibración técnica de máquinas herramientas en el taller fabril."],
     "Es el nivel más alto: define en qué negocios participar y cómo asignar recursos globales entre divisiones.",
     "El nivel corporativo abarca las decisiones de mayor alcance que comprometen a la empresa como un todo."],

    ["Una Unidad Estratégica de Negocios (UEN) se define técnicamente como:",
     ["Un foco de planificación con productos, clientes y rivales definidos.",
      "Un almacén central destinado a custodiar materias primas de reserva.",
      "Una oficina contable encargada de timbrar facturas ante el fisco hoy.",
      "Un comité de trabajadores formado para negociar condiciones salariales."],
     "Entidad organizativa independiente que atiende un mercado específico y diseña su propia estrategia competitiva.",
     "Una UEN agrupa productos/servicios para un grupo uniforme de clientes enfrentando un conjunto definido de competidores."],

    ["El objetivo principal del análisis de las Cinco Fuerzas de Porter consiste en:",
     ["Evaluar el atractivo y la rentabilidad estructural a largo plazo sectorial.",
      "Calcular la productividad diaria de los operarios en la planta fabril.",
      "Auditar los estados de flujo de caja para evitar desfalcos en tesorería.",
      "Medir la tasa de ausentismo laboral en las dependencias de la compañía."],
     "Porter examina la estructura industrial para determinar el rendimiento potencial del capital invertido en un sector.",
     "El modelo de las cinco fuerzas determina la rentabilidad estructural y el atractivo a largo plazo de una industria."],

    ["La rivalidad entre los competidores actuales de una industria se intensifica si:",
     ["El mercado crece lentamente, hay altos costos fijos y productos similares.",
      "Existen muy pocos rivales y el sector experimenta una rápida expansión.",
      "Los clientes enfrentan penalizaciones monetarias altas al cambiar marca.",
      "Los productos gozan de una fuerte diferenciación y lealtad de clientela."],
     "Si la demanda no crece y los costos fijos son altos, las empresas luchan ferozmente bajando precios para no quebrar.",
     "Bajo crecimiento, costos fijos elevados y falta de diferenciación desatan guerras de precios entre competidores."],

    ["Una barrera de salida elevada incrementa el riesgo de una industria debido a:",
     ["Que obliga a firmas deficitarias a seguir compitiendo saturando el sector.",
      "Que facilita la liquidación inmediata de activos obsoletos en remates.",
      "Que reduce los costos legales de indemnización al despedir a empleados.",
      "Que elimina la hostilidad de precios entre las empresas establecidas."],
     "Si cerrar una planta es carísimo (activos especializados o trabas laborales), las firmas se quedan luchando a pérdida.",
     "Las barreras de salida obligan a las empresas a permanecer operando, aumentando la inestabilidad y el riesgo de la industria."],

    ["La amenaza de nuevos participantes se neutraliza principalmente mediante:",
     ["La creación y fortalecimiento de sólidas barreras de entrada al sector.",
      "La rebaja de sueldos al personal fabril para generar fondos de caja.",
      "La reducción voluntaria de la participación de mercado de la compañía.",
      "La contratación de trabajadores temporales en temporadas de baja venta."],
     "Economías de escala, patentes, marcas leales o acceso a canales cierran el paso a nuevos entrantes.",
     "Erigir barreras de entrada dificulta el acceso a nuevos competidores, protegiendo las utilidades de las firmas establecidas."],

    ["Entre las principales barreras de entrada descritas por Porter destacan:",
     ["Economías de escala, diferenciación de marca y requerimientos de capital.",
      "Fallas de mantención en motores fabriles y conflictos gremiales internos.",
      "Cercanía física a puertos fluviales y subsidios de desempleo estatal.",
      "Ausencia de patentes y libre acceso a todos los canales de distribución."],
     "Ventajas de costo por volumen, capital intensivo y lealtad de clientes encarecen la llegada de novatos.",
     "Las economías de escala, capital, diferenciación y acceso a canales dificultan el ingreso de nuevos competidores."],

    ["En la relación entre barreras de entrada y salida, rendimientos elevados y riesgosos ocurren con:",
     ["Barreras de entrada altas acompañadas de barreras de salida elevadas.",
      "Barreras de entrada reducidas junto a barreras de salida muy bajas hoy.",
      "Barreras de entrada mínimas combinadas con barreras de salida altas.",
      "Barreras de entrada elevadas combinadas con barreras de salida bajas."],
     "Entrada alta asegura buenos rendimientos; pero salida alta atrapa a los rivales si el mercado cae, elevando el riesgo.",
     "Entrada alta y salida alta generan rendimientos elevados pero riesgosos ante crisis del sector."],

    ["La amenaza de productos sustitutos se vuelve especialmente crítica cuando:",
     ["Presentan una mejor relación valor-precio y bajos costos de cambio al usuario.",
      "Su costo de adquisición es muy superior al producto original de la firma.",
      "Los consumidores sienten un apego tradicional inflexible por la marca.",
      "No existen alternativas tecnológicas disponibles en el mercado nacional."],
     "Si un sustituto hace lo mismo a menor precio y cambiarse no cuesta nada, los márgenes de la industria colapsan.",
     "Sustitutos con excelente relación valor-precio y bajos costos de transición limitan el techo de rentabilidad de la industria."],

    ["El poder de negociación de los compradores aumenta considerablemente cuando:",
     ["Están concentrados, compran grandes volúmenes y el producto es homogéneo.",
      "Compran en cantidades mínimas dispersas y enfrentan altos costos de cambio.",
      "El producto adquirido es vital para la calidad final del bien del cliente.",
      "No tienen la capacidad técnica ni financiera de integrarse hacia atrás."],

   3. SISTEMA DE PROGRESO, GUARDADO, CARGA Y RESET
   ========================================================================= */
let userProgress = { completedPhases: [] };

try {
  const saved = localStorage.getItem('undertale_admin_progress');
  if (saved) userProgress = JSON.parse(saved);
} catch(e) {}

function saveProgressToFile() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(userProgress));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", `progreso_admin_undertale_${Date.now()}.json`);
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
}

function loadProgressFromFile(event) {
  const fileReader = new FileReader();
  if (event.target.files && event.target.files[0]) {
    fileReader.readAsText(event.target.files[0], "UTF-8");
    fileReader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (parsed && Array.isArray(parsed.completedPhases)) {
          userProgress = parsed;
          localStorage.setItem('undertale_admin_progress', JSON.stringify(userProgress));
          alert("¡Progreso cargado con éxito!");
          renderMainMenu();
        } else {
          alert("Archivo de progreso inválido.");
        }
      } catch (err) {
        alert("Error al leer el archivo.");
      }
    };
  }
}

function resetProgress() {
  const confirmReset = confirm("¿Deseas reestablecer todo tu progreso a cero?");
  if (confirmReset) {
    userProgress = { completedPhases: [] };
    try {
      localStorage.removeItem('undertale_admin_progress');
    } catch(e) {}
    alert("Progreso reestablecido con éxito.");
    renderMainMenu();
  }
}

function prepareShuffledQuiz(rawList) {
  const cloned = rawList.map(item => {
    const optionsWithMeta = item.options.map((optText, origIdx) => ({
      text: optText,
      isCorrect: origIdx === item.ans
    }));

    for (let i = optionsWithMeta.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [optionsWithMeta[i], optionsWithMeta[j]] = [optionsWithMeta[j], optionsWithMeta[i]];
    }

    const newCorrectIdx = optionsWithMeta.findIndex(o => o.isCorrect);

    return {
      id: item.id,
      phase: item.phase,
      q: item.q,
      options: optionsWithMeta.map(o => o.text),
      ans: newCorrectIdx,
      hint: item.hint,
      exp: item.exp
    };
  });

  for (let i = cloned.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
  }

  return cloned;
}

function startPastExam() {
  unlockAudioContext();
  playBleep(587.3, 'square', 0.1);
  gameState.currentPhase = 99;
  gameState.isSansBattle = false;
  gameState.isMarathon = false;
  const filtered = MASTER_QUESTION_BANK.filter(q => q.isPastExam);
  gameState.phaseQuestions = prepareShuffledQuiz(filtered);
  gameState.currentIndex = 0;
  gameState.score = 0;
  gameState.playerHP = 5;
  gameState.maxHP = 5;
  updateStatusUI();
  renderQuestionUI();
}

function startAdventure(phaseNum) {
  unlockAudioContext();
  playBleep(523.3, 'square', 0.1);
  gameState.currentPhase = phaseNum;
  gameState.isSansBattle = false;

  const filtered = MASTER_QUESTION_BANK.filter(q => q.phase === phaseNum && !q.isPastExam);

  gameState.score = 0;
  gameState.playerHP = 5;
  gameState.maxHP = 5;
  updateStatusUI();
  renderQuestionUI();
}

function updateStatusUI() {
  const statusBar = document.getElementById("statusBar");
  if (statusBar) statusBar.style.display = "flex";
  
  const hpContainerEl = document.getElementById("hpContainer");
  if (hpContainerEl) hpContainerEl.style.display = "flex";
  const selfScoreEl = document.getElementById("selfScore");
  if (selfScoreEl) selfScoreEl.style.display = "none";

  const hpFill = document.getElementById("hpBarFill");
  const hpText = document.getElementById("hpText");
  
  if (hpText) hpText.innerText = `${gameState.playerHP}/${gameState.maxHP}`;
  if (hpFill) {
    const fillPct = (gameState.playerHP / gameState.maxHP) * 100;
    hpFill.style.width = `${Math.max(0, fillPct)}%`;
  }
}

function renderQuestionUI() {
  const container = document.getElementById("screenContent");
  if (!container) return;
  const qData = gameState.phaseQuestions[gameState.currentIndex];

  let optionsHTML = "";
  qData.options.forEach((opt, idx) => {
    optionsHTML += `
      <button class="option-btn" onclick="checkAnswer(${idx})" onmouseover="playBleep(320, 'sine', 0.02)">
        <span class="soul-icon">❤️</span>
        <span>${String.fromCharCode(65 + idx)}) ${opt}</span>
      </button>
    `;
  });

  const totalQ = gameState.phaseQuestions.length;
  const currentQNum = gameState.currentIndex + 1;
  const progressPct = (gameState.currentIndex / totalQ) * 100;

  container.innerHTML = `
    <div class="progress-section">
      <div style="display:flex; justify-content:space-between;">
        <span>Progreso (${totalQ === MASTER_QUESTION_BANK.length ? `Maratón ${totalQ} P.` : 'Unidad Actual'}):</span>

      </div>
    </div>

        <span class="soul-icon">❤️</span>

        <span>SIGUIENTE ➔</span>
      </button>
    </div>
  `;

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleHint() {
  unlockAudioContext();
  playBleep(440, 'triangle', 0.08);
  const hintBox = document.getElementById("hintBox");
  const qData = gameState.phaseQuestions[gameState.currentIndex];
  if (!hintBox) return;

  if (hintBox.style.display === "none" || hintBox.style.display === "") {
    hintBox.style.display = "block";
    hintBox.innerHTML = `💡 <strong>PISTA:</strong><br>${qData.hint || "Analiza los conceptos clave vistos en las diapositivas y textos de clase."}`;
  } else {
    hintBox.style.display = "none";
  }
}

function checkAnswer(selectedIdx) {
  unlockAudioContext();
  const qData = gameState.phaseQuestions[gameState.currentIndex];
  const feedback = document.getElementById("feedbackPanel");
  const nextBtn = document.getElementById("nextQuestionBtn");
  const optionsContainer = document.getElementById("optionsContainer");

  const buttons = optionsContainer.getElementsByTagName("button");
  for (let b of buttons) {
    b.disabled = true;
    b.style.opacity = "0.65";
    b.style.cursor = "default";
  }

  if (selectedIdx === qData.ans) {
    playBleep(587.3, 'triangle', 0.15);
    gameState.score++;
    feedback.className = "feedback-panel correct";
    feedback.style.display = "block";
    feedback.innerHTML = `
      <strong>¡CORRECTO!</strong><br>
      ${qData.exp}
    `;
    nextBtn.style.display = "flex";
  } else {
    playDamageSound();
    gameState.playerHP--;
    updateStatusUI();

    feedback.className = "feedback-panel incorrect";
    feedback.style.display = "block";
    feedback.innerHTML = `
      <strong>¡RESPUESTA INCORRECTA!</strong><br>
      Opción correcta: <strong>${String.fromCharCode(65 + qData.ans)}) ${qData.options[qData.ans]}</strong><br>
      <em>${qData.exp}</em>
    `;

    if (gameState.playerHP <= 0) {
      setTimeout(() => triggerGameOver(), 800);
      return;
    } else {
      nextBtn.style.display = "flex";
    }
  }
}

function nextQuestion() {
  unlockAudioContext();
  gameState.currentIndex++;
  if (gameState.currentIndex < gameState.phaseQuestions.length) {
    renderQuestionUI();
  } else {
    let targetPhase = gameState.currentPhase;
    if (gameState.isMarathon) targetPhase = 8;
    if (targetPhase) {
      if (!userProgress.completedPhases.includes(targetPhase)) {
        userProgress.completedPhases.push(targetPhase);
        try {
          localStorage.setItem('undertale_admin_progress', JSON.stringify(userProgress));
        } catch(e){}
      }
    }
    triggerVictory();
  }
}

    startMarathonAll();
  } else {
    startAdventure(gameState.currentPhase);
  }
