      --hp-green: #00ff00;

    }

    * {
      box-sizing: border-box;
      -webkit-box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: var(--bg-color);
      color: var(--text-white);
      font-family: 'Press Start 2P', monospace, sans-serif;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      overflow-x: hidden;
      touch-action: manipulation;

    #game-container {
      width: 100%;
      max-width: 860px;
      background: #000;
      border: 5px solid var(--border-color);
      padding: 18px;
      position: relative;
      box-shadow: 0 0 0 3px #000, 0 0 0 6px var(--border-color);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 3px solid var(--border-color);
      font-size: 11px;
      gap: 8px;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hp-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hp-label {
      font-size: 10px;
      color: #fff;
    }

    .hp-bar-bg {
      width: 85px;
      height: 16px;
      background-color: var(--ut-red);
      position: relative;
      border: 1px solid #fff;
    }

    .hp-bar-fill {
      height: 100%;
      width: 100%;
      background-color: var(--ut-yellow);
      transition: width 0.2s ease-out;
    }

    .hp-num {
      font-size: 10px;
      min-width: 45px;
    }

    .progress-section {
      margin-bottom: 14px;
      font-size: 9.5px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background-color: #222;
      border: 2px solid var(--border-color);
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: var(--hint-cyan);
      transition: width 0.3s ease;
    }

    .dialogue-box {
      border: 4px solid var(--border-color);
      background: #000;
      padding: 16px;
      min-height: 90px;
      margin-bottom: 16px;
      font-size: 12px;
      line-height: 1.7;
      letter-spacing: 0.5px;
    }

    .dialogue-prefix {
      color: var(--ut-yellow);
      margin-bottom: 8px;
      display: block;
      font-size: 11px;
    }

    .hint-box {
      display: none;
      border: 2px dashed var(--hint-cyan);
      background: #041419;
      color: var(--hint-cyan);
      padding: 12px 14px;
      margin-bottom: 14px;
      font-size: 10.5px;
      line-height: 1.6;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
      width: 100%;
    }

    .option-btn {
      background: #000;
      color: #fff;
      border: 3px solid var(--border-color);
      padding: 14px 14px;
      font-family: inherit;
      font-size: 10.5px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      line-height: 1.5;
      width: 100%;
      min-height: 48px;
      transition: border-color 0.1s;
    }

      color: var(--hp-green);
    }

      color: var(--ut-yellow);
      outline: none;
    }

      display: inline-block;
      width: 12px;
      height: 12px;
      color: var(--soul-color);
      visibility: hidden;
      font-size: 12px;
      line-height: 1;
      flex-shrink: 0;

    .option-btn:active .soul-icon,

      visibility: visible;
    }

      border: 3px solid var(--border-color);

      margin-bottom: 14px;
      font-size: 10.5px;
      line-height: 1.6;

      color: #98ff98;
      background: #021a02;

      background: #1a0202;
    }

      flex-wrap: wrap;

      border-top: 3px solid var(--border-color);
      padding-top: 14px;

      color: var(--ut-orange);
      border: 3px solid var(--ut-orange);

      font-family: inherit;
      font-size: 10px;

      display: flex;
      align-items: center;
      gap: 6px;

      color: #000;

      }
      .action-btn {

        font-size: 9px;
      }

      }

        width: 110px;
      }
      .save-load-btn {

        min-width: 100%;

/* =========================================================================
   1. SISTEMA DE AUDIO BLINDADO PARA iOS WEBKIT
   ========================================================================= */
let audioCtx = null;
let soundEnabled = true;

function unlockAudioContext() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) {
      audioCtx = new AudioContextClass();
    }
  }
  if (audioCtx && (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted')) {
    audioCtx.resume().catch(() => {});
  }
}

['touchstart', 'touchend', 'click', 'pointerdown'].forEach(evt => {
  document.addEventListener(evt, unlockAudioContext, { passive: true, once: false });
});

function toggleAudio() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById("muteBtn");
  if (btn) btn.innerText = soundEnabled ? "SONIDO: ON" : "SONIDO: OFF";
}

function playBleep(freq = 440, type = 'square', duration = 0.05) {
  if (!soundEnabled) return;
  try {
    unlockAudioContext();
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

function playDamageSound() {
  if (!soundEnabled) return;
  try {
    unlockAudioContext();
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.25);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.25);
  } catch (e) {}
}

function playVictorySound() {
  if (!soundEnabled) return;
  const notes = [261.6, 329.6, 392.0, 523.3];
  notes.forEach((freq, idx) => {
    setTimeout(() => playBleep(freq, 'triangle', 0.16), idx * 120);
  });
}

function playGameOverSting() {
  if (!soundEnabled) return;
  const notes = [220, 207.6, 196, 185];
  notes.forEach((freq, idx) => {
    setTimeout(() => playBleep(freq, 'sawtooth', 0.32), idx * 240);
  });
}

let userProgress = {
  completedPhases: []
};

try {
  const saved = localStorage.getItem('undertale_admin_progress');
  if (saved) {
    userProgress = JSON.parse(saved);
  }
} catch(e) {}

function saveProgressToFile() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(userProgress));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", `progreso_admin_undertale_${Date.now()}.json`);
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
}

function loadProgressFromFile(event) {
  const fileReader = new FileReader();
  if (event.target.files && event.target.files[0]) {
    fileReader.readAsText(event.target.files[0], "UTF-8");
    fileReader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (parsed && Array.isArray(parsed.completedPhases)) {
          userProgress = parsed;
          localStorage.setItem('undertale_admin_progress', JSON.stringify(userProgress));
          alert("¡Progreso cargado con éxito!");
          renderMainMenu();
        } else {
          alert("Archivo de progreso inválido.");
        }
      } catch (err) {
        alert("Error al leer el archivo.");
      }
    };
  }
}

// Función para reestablecer progreso a cero
function resetProgress() {
  const confirmReset = confirm("¿Estás seguro de que deseas reestablecer todo tu progreso? Volverás a empezar como si no hubieses hecho nada.");
  if (confirmReset) {
    userProgress = { completedPhases: [] };
    try {
      localStorage.removeItem('undertale_admin_progress');
    } catch(e) {}
    alert("Progreso reestablecido con éxito.");
    renderMainMenu();
  }
}

function prepareShuffledQuiz(rawList) {
  const cloned = rawList.map(item => {
    const optionsWithMeta = item.options.map((optText, origIdx) => ({
      text: optText,
      isCorrect: origIdx === item.ans
    }));

    for (let i = optionsWithMeta.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [optionsWithMeta[i], optionsWithMeta[j]] = [optionsWithMeta[j], optionsWithMeta[i]];
    }

    const newCorrectIdx = optionsWithMeta.findIndex(o => o.isCorrect);

    return {
      id: item.id,
      phase: item.phase,
      q: item.q,
      options: optionsWithMeta.map(o => o.text),
      ans: newCorrectIdx,
      hint: item.hint,
      exp: item.exp
    };
  });

  for (let i = cloned.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
  }

  return cloned;
}

  unlockAudioContext();
  playBleep(440, 'triangle', 0.08);

  if (hintBox.style.display === "none" || hintBox.style.display === "") {
    hintBox.style.display = "block";
    hintBox.innerHTML = `💡 <strong>PISTA:</strong><br>${qData.hint || "Analiza los conceptos clave vistos en las diapositivas y textos de clase."}`;
  } else {
    hintBox.style.display = "none";
  }

function checkAnswer(selectedIdx) {
  unlockAudioContext();
  const qData = gameState.phaseQuestions[gameState.currentIndex];
  const feedback = document.getElementById("feedbackPanel");
  const nextBtn = document.getElementById("nextQuestionBtn");
  const optionsContainer = document.getElementById("optionsContainer");

  const buttons = optionsContainer.getElementsByTagName("button");
  for (let b of buttons) {
    b.disabled = true;
    b.style.opacity = "0.65";
    b.style.cursor = "default";
  }

  if (selectedIdx === qData.ans) {
    playBleep(587.3, 'triangle', 0.15);
    gameState.score++;
    feedback.className = "feedback-panel correct";
    feedback.style.display = "block";
    feedback.innerHTML = `
      <strong>¡CORRECTO!</strong><br>
      ${qData.exp}
    `;
    nextBtn.style.display = "flex";
  } else {
    playDamageSound();
    gameState.playerHP--;
    updateStatusUI();

    feedback.className = "feedback-panel incorrect";
    feedback.style.display = "block";
    feedback.innerHTML = `
      <strong>¡RESPUESTA INCORRECTA!</strong><br>
      Opción correcta: <strong>${String.fromCharCode(65 + qData.ans)}) ${qData.options[qData.ans]}</strong><br>
      <em>${qData.exp}</em>
    `;

    if (gameState.playerHP <= 0) {
      setTimeout(() => triggerGameOver(), 800);
      return;
    } else {
      nextBtn.style.display = "flex";
    }
  }
}

function nextQuestion() {
  unlockAudioContext();
  gameState.currentIndex++;
  if (gameState.currentIndex < gameState.phaseQuestions.length) {
    renderQuestionUI();
  } else {
    const targetPhase = gameState.isMarathon ? 8 : gameState.currentPhase;
    if (!userProgress.completedPhases.includes(targetPhase)) {
      userProgress.completedPhases.push(targetPhase);
      try {
        localStorage.setItem('undertale_admin_progress', JSON.stringify(userProgress));
      } catch(e){}
    }
    triggerVictory();
  }
}

    startPastExam();
  } else if (gameState.isSansBattle) {
    startSansTrial();
  } else if (gameState.isMarathon) {
    startMarathonAll();
  } else {
    startAdventure(gameState.currentPhase);
  }
}

function triggerVictory() {
  playVictorySound();
  document.getElementById("statusBar").style.display = "none";
  const container = document.getElementById("screenContent");
  
  let rank = "C - Administrador Junior";
  if (gameState.score >= gameState.phaseQuestions.length * 0.9) rank = "S - ADMINISTRADOR LEGENDARIO";
  else if (gameState.score >= gameState.phaseQuestions.length * 0.75) rank = "A - GERENTE ESTRATÉGICO";
  else if (gameState.score >= gameState.phaseQuestions.length * 0.5) rank = "B - ANALISTA SENIOR";

  container.innerHTML = `
    <div class="screen-overlay">
      <div style="font-size:38px; margin-bottom:14px;">🏆❤️</div>
      <div class="screen-title" style="color:#00ff00;">¡UNIDAD COMPLETADA CON ÉXITO!</div>
      <p style="font-size:10.5px; line-height:1.8; max-width:580px; color:#eee;">
        Has superado este módulo. ¡Su estado se ha marcado en verde en el menú!
      </p>
      <div style="margin:16px 0; border:3px solid var(--ut-yellow); padding:14px; font-size:10.5px; line-height:1.6;">
        PUNTUACIÓN FINAL: ${gameState.score} / ${gameState.phaseQuestions.length}<br>
        RANGO ALCANZADO: <span style="color:var(--ut-yellow);">${rank}</span>
      </div>
      <div class="menu-grid">
        <button class="option-btn" onclick="renderMainMenu()">
          <span class="soul-icon">❤️</span>
          <span>VOLVER AL MENÚ PRINCIPAL</span>
        </button>
      </div>
    </div>
  `;
}
</script>
