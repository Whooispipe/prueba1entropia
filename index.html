<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>UNDERTALE: Administración de Empresas</title>
  
  <!-- CONFIGURACIÓN PWA Y COMPATIBILIDAD iOS SAFARI -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#000000">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #000000;
      --border-color: #ffffff;
      --text-white: #ffffff;
      --ut-yellow: #ffff00;
      --ut-orange: #ff9800;
      --ut-red: #c00000;
      --soul-color: #ff0000;
      --hint-cyan: #00ffff;
      --hp-green: #00ff00;
      --sobre-azul: #64c8ff;
    }

    * {
      box-sizing: border-box;
      -webkit-box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: var(--bg-color);
      color: var(--text-white);
      font-family: 'Press Start 2P', monospace, sans-serif;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      overflow-x: hidden;
      touch-action: manipulation;
    }

    #game-container {
      width: 100%;
      max-width: 860px;
      background: #000;
      border: 5px solid var(--border-color);
      padding: 18px;
      position: relative;
      box-shadow: 0 0 0 3px #000, 0 0 0 6px var(--border-color);
    }

    /* BARRA DE ESTADO UNIVERSAL */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 3px solid var(--border-color);
      font-size: 11px;
      gap: 8px;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hp-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hp-label {
      font-size: 10px;
      color: #fff;
    }

    .hp-bar-bg {
      width: 85px;
      height: 16px;
      background-color: var(--ut-red);
      position: relative;
      border: 1px solid #fff;
    }

    .hp-bar-fill {
      height: 100%;
      width: 100%;
      background-color: var(--ut-yellow);
      transition: width 0.2s ease-out;
    }

    .hp-num {
      font-size: 10px;
      min-width: 45px;
    }

    /* BARRA DE PROGRESO DE PREGUNTAS */
    .progress-section {
      margin-bottom: 14px;
      font-size: 9.5px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background-color: #222;
      border: 2px solid var(--border-color);
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: var(--hint-cyan);
      transition: width 0.3s ease;
    }

    /* CAJA DE PREGUNTA */
    .dialogue-box {
      border: 4px solid var(--border-color);
      background: #000;
      padding: 16px;
      min-height: 90px;
      margin-bottom: 16px;
      font-size: 12px;
      line-height: 1.7;
      letter-spacing: 0.5px;
    }

    .dialogue-prefix {
      color: var(--ut-yellow);
      margin-bottom: 8px;
      display: block;
      font-size: 11px;
    }

    /* CAJA DE PISTA */
    .hint-box {
      display: none;
      border: 2px dashed var(--hint-cyan);
      background: #041419;
      color: var(--hint-cyan);
      padding: 12px 14px;
      margin-bottom: 14px;
      font-size: 10.5px;
      line-height: 1.6;
    }

    /* ALTERNATIVAS A LO ANCHO (FULL WIDTH) */
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
      width: 100%;
    }

    .option-btn {
      background: #000;
      color: #fff;
      border: 3px solid var(--border-color);
      padding: 14px 14px;
      font-family: inherit;
      font-size: 10.5px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      line-height: 1.5;
      width: 100%;
      min-height: 48px;
      transition: border-color 0.1s;
    }

    .option-btn.completed-unit {
      border-color: var(--hp-green);
      color: var(--hp-green);
    }

    .option-btn:hover, .option-btn:active, .option-btn:focus {
      border-color: var(--ut-yellow);
      color: var(--ut-yellow);
      outline: none;
    }

    .soul-icon {
      display: inline-block;
      width: 12px;
      height: 12px;
      color: var(--soul-color);
      visibility: hidden;
      font-size: 12px;
      line-height: 1;
      flex-shrink: 0;
    }

    .option-btn:hover .soul-icon,
    .option-btn:active .soul-icon,
    .action-btn:hover .soul-icon {
      visibility: visible;
    }

    /* PANEL DE FEEDBACK */
    .feedback-panel {
      display: none;
      border: 3px solid var(--border-color);
      padding: 12px 14px;
      margin-bottom: 14px;
      font-size: 10.5px;
      line-height: 1.6;
    }

    .feedback-panel.correct {
      border-color: var(--hp-green);
      color: #98ff98;
      background: #021a02;
    }

    .feedback-panel.incorrect {
      border-color: var(--ut-red);
      color: #ff8888;
      background: #1a0202;
    }

    /* ACCIONES INFERIORES */
    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      border-top: 3px solid var(--border-color);
      padding-top: 14px;
    }

    .action-btn {
      background: #000;
      color: var(--ut-orange);
      border: 3px solid var(--ut-orange);
      padding: 10px 14px;
      font-family: inherit;
      font-size: 10px;
      cursor: pointer;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
    }

    .action-btn:active, .action-btn:hover {
      background: var(--ut-orange);
      color: #000;
    }

    .action-btn.hint-btn {
      color: var(--hint-cyan);
      border-color: var(--hint-cyan);
    }

    .action-btn.hint-btn:active, .action-btn.hint-btn:hover {
      background: var(--hint-cyan);
      color: #000;
    }

    /* PANTALLAS */
    .screen-overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px 4px;
    }

    .screen-title {
      font-size: 15px;
      color: var(--ut-yellow);
      margin-bottom: 14px;
      line-height: 1.6;
    }

    .menu-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 620px;
      margin-top: 14px;
    }

    .phase-badge {
      font-size: 8px;
      padding: 3px 5px;
      border: 1px solid #fff;
      color: var(--ut-yellow);
      margin-left: auto;
    }

    .phase-badge.done {
      border-color: var(--hp-green);
      color: var(--hp-green);
    }

    .save-load-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 620px;
      margin-top: 12px;
    }

    .save-load-btn {
      flex: 1;
      background: #000;
      color: #fff;
      border: 2px solid var(--border-color);
      padding: 10px;
      font-family: inherit;
      font-size: 9px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .save-load-btn:hover {
      background: #222;
      border-color: var(--ut-yellow);
      color: var(--ut-yellow);
    }

    /* ESTILO DEL SOBRE AZUL EN GAME OVER */
    .game-over-envelope {
      width: 130px;
      max-width: 70%;
      height: auto;
      image-rendering: pixelated;
      margin-bottom: 16px;
      filter: drop-shadow(0 0 10px rgba(100, 200, 255, 0.8));
    }

    @media (max-width: 480px) {
      #game-container {
        padding: 12px 10px;
        border-width: 3px;
        box-shadow: 0 0 0 2px #000, 0 0 0 4px var(--border-color);
      }
      .dialogue-box {
        font-size: 10px;
        padding: 12px;
      }
      .option-btn {
        font-size: 9.5px;
        padding: 12px 10px;
      }
      .status-bar {
        font-size: 9px;
      }
      .hp-bar-bg {
        width: 70px;
      }
      .action-btn {
        padding: 8px 10px;
        font-size: 9px;
      }
      .screen-title {
        font-size: 13px;
      }
      .game-over-envelope {
        width: 110px;
      }
    }
  </style>
</head>

</div>

<script>
/* =========================================================================
   1. SISTEMA DE AUDIO BLINDADO PARA iOS WEBKIT
   ========================================================================= */
let audioCtx = null;
let soundEnabled = true;

function unlockAudioContext() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) {
      audioCtx = new AudioContextClass();
    }
  }
  if (audioCtx && (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted')) {
    audioCtx.resume().catch(() => {});
  }
}

['touchstart', 'touchend', 'click', 'pointerdown'].forEach(evt => {
  document.addEventListener(evt, unlockAudioContext, { passive: true, once: false });
});

function toggleAudio() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById("muteBtn");
  if (btn) btn.innerText = soundEnabled ? "SONIDO: ON" : "SONIDO: OFF";
}

function playBleep(freq = 440, type = 'square', duration = 0.05) {
  if (!soundEnabled) return;
  try {
    unlockAudioContext();
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

function playDamageSound() {
  if (!soundEnabled) return;
  try {
    unlockAudioContext();
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.25);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.25);
  } catch (e) {}
}

function playVictorySound() {
  if (!soundEnabled) return;
  const notes = [261.6, 329.6, 392.0, 523.3];
  notes.forEach((freq, idx) => {
    setTimeout(() => playBleep(freq, 'triangle', 0.16), idx * 120);
  });
}

function playGameOverSting() {
  if (!soundEnabled) return;
  const notes = [220, 207.6, 196, 185];
  notes.forEach((freq, idx) => {
    setTimeout(() => playBleep(freq, 'sawtooth', 0.32), idx * 240);
  });
}

  const saved = localStorage.getItem('undertale_admin_progress');

    userProgress = JSON.parse(saved);
  }
} catch(e) {}

function saveProgressToFile() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(userProgress));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", `progreso_admin_undertale_${Date.now()}.json`);
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
}

function loadProgressFromFile(event) {
  const fileReader = new FileReader();
  if (event.target.files && event.target.files[0]) {
    fileReader.readAsText(event.target.files[0], "UTF-8");
    fileReader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (parsed && Array.isArray(parsed.completedPhases)) {
          userProgress = parsed;
          localStorage.setItem('undertale_admin_progress', JSON.stringify(userProgress));
          alert("¡Progreso cargado con éxito!");
          renderMainMenu();
        } else {
          alert("Archivo de progreso inválido.");
        }
      } catch (err) {
        alert("Error al leer el archivo.");
      }
    };
  }
}

function prepareShuffledQuiz(rawList) {
  const cloned = rawList.map(item => {
    const optionsWithMeta = item.options.map((optText, origIdx) => ({
      text: optText,
      isCorrect: origIdx === item.ans
    }));

    for (let i = optionsWithMeta.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [optionsWithMeta[i], optionsWithMeta[j]] = [optionsWithMeta[j], optionsWithMeta[i]];
    }

    const newCorrectIdx = optionsWithMeta.findIndex(o => o.isCorrect);

    return {
      id: item.id,
      phase: item.phase,
      q: item.q,
      options: optionsWithMeta.map(o => o.text),
      ans: newCorrectIdx,
      hint: item.hint,
      exp: item.exp
    };
  });

  for (let i = cloned.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
  }

  return cloned;
}

  gameState.maxHP = 5;

}

function updateStatusUI() {

    document.getElementById("currentPhaseLabel").innerText = PHASES_NAMES[gameState.currentPhase] || `FASE ${gameState.currentPhase}`;
  }
  document.getElementById("hpText").innerText = `${gameState.playerHP}/${gameState.maxHP}`;
  
  const fillPct = (gameState.playerHP / gameState.maxHP) * 100;
  document.getElementById("hpBarFill").style.width = `${Math.max(0, fillPct)}%`;

        <span class="soul-icon">❤️</span>

function toggleHint() {
  unlockAudioContext();
  playBleep(440, 'triangle', 0.08);
  const hintBox = document.getElementById("hintBox");
  const qData = gameState.phaseQuestions[gameState.currentIndex];
  if (!hintBox) return;

  if (hintBox.style.display === "none" || hintBox.style.display === "") {
    hintBox.style.display = "block";
    hintBox.innerHTML = `💡 <strong>PISTA:</strong><br>${qData.hint || "Analiza los conceptos clave vistos en las diapositivas y textos de clase."}`;
  } else {
    hintBox.style.display = "none";
  }
}

function checkAnswer(selectedIdx) {
  unlockAudioContext();
  const qData = gameState.phaseQuestions[gameState.currentIndex];
  const feedback = document.getElementById("feedbackPanel");
  const nextBtn = document.getElementById("nextQuestionBtn");
  const optionsContainer = document.getElementById("optionsContainer");

  const buttons = optionsContainer.getElementsByTagName("button");
  for (let b of buttons) {
    b.disabled = true;
    b.style.opacity = "0.65";
    b.style.cursor = "default";
  }

  if (selectedIdx === qData.ans) {
    playBleep(587.3, 'triangle', 0.15);
    gameState.score++;
    feedback.className = "feedback-panel correct";
    feedback.style.display = "block";
    feedback.innerHTML = `
      <strong>¡CORRECTO!</strong><br>
      ${qData.exp}
    `;
    nextBtn.style.display = "flex";
  } else {
    playDamageSound();
    gameState.playerHP--;
    updateStatusUI();

    feedback.className = "feedback-panel incorrect";
    feedback.style.display = "block";
    feedback.innerHTML = `
      <strong>¡RESPUESTA INCORRECTA!</strong><br>
      Opción correcta: <strong>${String.fromCharCode(65 + qData.ans)}) ${qData.options[qData.ans]}</strong><br>
      <em>${qData.exp}</em>
    `;

    if (gameState.playerHP <= 0) {
      setTimeout(() => triggerGameOver(), 800);
      return;
    } else {
      nextBtn.style.display = "flex";
    }
  }
}

function nextQuestion() {
  unlockAudioContext();
  gameState.currentIndex++;
  if (gameState.currentIndex < gameState.phaseQuestions.length) {
    renderQuestionUI();
  } else {
    // Registrar fase como completada en verde
    const targetPhase = gameState.isMarathon ? 8 : gameState.currentPhase;
    if (targetPhase >= 1 && targetPhase <= 8) {
      if (!userProgress.completedPhases.includes(targetPhase)) {
        userProgress.completedPhases.push(targetPhase);
        try {
          localStorage.setItem('undertale_admin_progress', JSON.stringify(userProgress));
        } catch(e){}
      }
    }
    triggerVictory();
  }
}
