}

function getMarks() {
  if (!userProgress.selfMarks || typeof userProgress.selfMarks !== 'object') userProgress.selfMarks = {};
  return userProgress.selfMarks;
}

function escapeHTML(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Ignora mayúsculas, tildes, espacios, signos y artículos iniciales
function normalizeAnswer(str) {
  let s = String(str || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  s = s.replace(/[^a-z0-9\s]/g, ' ');
  const words = s.split(/\s+/).filter(Boolean);
  while (words.length > 1 && ['el', 'la', 'los', 'las', 'un', 'una'].includes(words[0])) words.shift();
  return words.join('');
}

function matchesCloze(userText, variants) {
  const n = normalizeAnswer(userText);
  if (!n) return false;
  return variants.some(v => normalizeAnswer(v) === n);
}

function clozeSentenceHTML(item, filled) {
  const parts = item.s.split('___').map(escapeHTML);
  const blank = filled
    ? `<span class="blank-filled">${escapeHTML(item.a[0])}</span>`
    : `<span class="blank-slot">&nbsp;</span>`;
  return parts.join(blank);
}

function clozeHint(item) {
  if (item.hint) return escapeHTML(item.hint);
  const first = item.a[0];
  const words = first.split(/\s+/);
  const size = words.length === 1 ? `${first.length} letras` : `${words.length} palabras`;
  return `Empieza con «${escapeHTML(first.charAt(0).toUpperCase())}» y tiene ${size}.<br>Tema: ${escapeHTML(item.topic)}.`;
}

function scrollToTopSafe() {
  try { document.body.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {}
  try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {}
}

/* ---------- Estado de la sesión ---------- */
let selfState = null;

function setSelfStatus() {
  const bar = document.getElementById('statusBar');
  if (bar) bar.style.display = 'flex';
  const hpc = document.getElementById('hpContainer');
  if (hpc) hpc.style.display = 'none';
  const ss = document.getElementById('selfScore');
  if (ss && selfState) {
    ss.style.display = 'inline';
    ss.innerHTML = `<span style="color:var(--hp-green);">✔ ${selfState.good}</span> &nbsp; <span style="color:#ff6666;">✘ ${selfState.bad}</span>`;
  }
}

/* ---------- Submenú de la fase 9 ---------- */
function renderSelfMenu() {
  unlockAudioContext();
  const bar = document.getElementById('statusBar');
  if (bar) bar.style.display = 'none';
  const container = document.getElementById('screenContent');
  if (!container) return;

  const marks = getMarks();
  const count = (bank, v) => bank.filter(i => marks[i.id] === v).length;
  const cGood = count(CLOZE_BANK, 'good'), cBad = count(CLOZE_BANK, 'bad');
  const dGood = count(DEV_BANK, 'good'), dBad = count(DEV_BANK, 'bad');
  const doneC = userProgress.completedPhases.includes(91);
  const doneD = userProgress.completedPhases.includes(92);

  const reviewButtons = `
    ${cBad > 0 ? `
    <button class="option-btn" style="border-color:#ff6666; color:#ff6666;" onclick="startSelfSession('cloze', true)">
      <span class="soul-icon">❤️</span>
      <span>🔁 Repasar frases que marqué MALAS</span>
      <span class="phase-badge" style="border-color:#ff6666; color:#ff6666;">${cBad}</span>
    </button>` : ''}
    ${dBad > 0 ? `
    <button class="option-btn" style="border-color:#ff6666; color:#ff6666;" onclick="startSelfSession('dev', true)">
      <span class="soul-icon">❤️</span>
      <span>🔁 Repasar desarrollos que marqué MALOS</span>
      <span class="phase-badge" style="border-color:#ff6666; color:#ff6666;">${dBad}</span>
    </button>` : ''}
  `;

  container.innerHTML = `
    <div class="screen-overlay">
      <div style="font-size:30px; margin-bottom:10px;">✍️</div>
      <div class="screen-title" style="color:var(--self-pink);">FASE 9<br><span style="font-size:11px; color:#fff;">COMPLETA LA FRASE Y PREGUNTAS DE DESARROLLO</span></div>
      <p style="font-size:9px; line-height:1.8; max-width:620px; color:#ccc;">
        Escribe tu respuesta, pulsa <span style="color:var(--self-pink);">COMPROBAR</span> y compárala con la correcta.
        Después califícate con honestidad: <span style="color:var(--hp-green);">BUENA</span> o <span style="color:#ff6666;">MALA</span>.
        Las malas quedan guardadas para repasarlas.
      </p>

      <div class="menu-grid">
        <button class="option-btn ${doneC ? 'completed-unit' : ''}" style="${doneC ? '' : 'border-color:var(--self-pink); color:var(--self-pink);'}" onclick="startSelfSession('cloze', false)">
          <span class="soul-icon">❤️</span>
          <span>✍️ 9A. COMPLETA LA FRASE (${CLOZE_BANK.length} frases)</span>
          <span class="phase-badge ${doneC ? 'done' : ''}" ${doneC ? '' : 'style="border-color:var(--self-pink); color:var(--self-pink);"'}>${cGood}/${CLOZE_BANK.length} ✔</span>
        </button>
        <button class="option-btn ${doneD ? 'completed-unit' : ''}" style="${doneD ? '' : 'border-color:var(--self-pink); color:var(--self-pink);'}" onclick="startSelfSession('dev', false)">
          <span class="soul-icon">❤️</span>
          <span>📝 9B. PREGUNTAS DE DESARROLLO (${DEV_BANK.length} preguntas)</span>
          <span class="phase-badge ${doneD ? 'done' : ''}" ${doneD ? '' : 'style="border-color:var(--self-pink); color:var(--self-pink);"'}>${dGood}/${DEV_BANK.length} ✔</span>
        </button>
        ${reviewButtons}
        <button class="option-btn" onclick="renderMainMenu()">
          <span class="soul-icon">❤️</span>
          <span>⬅ VOLVER AL MENÚ PRINCIPAL</span>
        </button>
      </div>
    </div>
  `;
  scrollToTopSafe();
}

/* ---------- Inicio de sesión ---------- */
function startSelfSession(kind, onlyBad) {
  unlockAudioContext();
  playBleep(kind === 'cloze' ? 698 : 784, 'square', 0.1);
  const bank = kind === 'cloze' ? CLOZE_BANK : DEV_BANK;
  const marks = getMarks();
  let pool = bank.slice();
  if (onlyBad) pool = pool.filter(it => marks[it.id] === 'bad');
  if (pool.length === 0) {
    alert('No tienes preguntas marcadas como malas en esta sección.');
    return;
  }
  selfState = {
    kind: kind,
    items: shuffleArray(pool),
    idx: 0,
    good: 0,
    bad: 0,
    failedIds: [],
    review: !!onlyBad,
    checked: false,
    marked: false
  };
  renderSelfQuestion();
}

/* ---------- Pantalla de pregunta ---------- */
function renderSelfQuestion() {
  const container = document.getElementById('screenContent');
  if (!container || !selfState) return;
  const st = selfState;
  st.checked = false;
  st.marked = false;
  setSelfStatus();

  const item = st.items[st.idx];
  const total = st.items.length;
  const isCloze = st.kind === 'cloze';
  const progressPct = (st.idx / total) * 100;
  const isLast = st.idx === total - 1;

  const bodyHTML = isCloze
    ? `<div id="selfSentence">${clozeSentenceHTML(item, false)}</div>`
    : `<div>${escapeHTML(item.q)}</div>`;

  const inputHTML = isCloze
    ? `<input id="selfInput" class="self-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
              placeholder="Escribe la palabra que falta..." onkeydown="if(event.key==='Enter'){checkSelf();}">`
    : `<textarea id="selfInput" class="self-input" rows="8" placeholder="Escribe aquí tu respuesta de desarrollo..."></textarea>`;

  container.innerHTML = `
    <div class="progress-section">
      <div style="display:flex; justify-content:space-between;">
        <span>${isCloze ? 'Completa la frase' : 'Desarrollo'}${st.review ? ' (repaso)' : ''}:</span>
        <span style="color:var(--hint-cyan);">${st.idx} / ${total}</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" style="width: ${progressPct}%;"></div>
      </div>
    </div>

    <div class="dialogue-box">
      <span class="dialogue-prefix">* ${isCloze ? 'COMPLETA LA FRASE' : 'DESARROLLO'} ${st.idx + 1} DE ${total}:
        <span class="topic-tag">Tema: ${escapeHTML(item.topic)}</span>
      </span>
      ${bodyHTML}
    </div>

    <div class="hint-box" id="hintBox"></div>

    ${inputHTML}

    <button class="action-btn check-btn" id="checkBtn" onclick="checkSelf()">
      <span>COMPROBAR</span>
    </button>

    <div class="reveal-panel" id="revealPanel"></div>

    <div class="mark-zone" id="markZone">
      <div class="mark-title">Sé honesto: ¿tu respuesta estaba buena o mala?</div>
      <div class="mark-row">
        <button class="mark-btn good" id="markGood" onclick="markSelf('good')">✔ BUENA</button>
        <button class="mark-btn bad" id="markBad" onclick="markSelf('bad')">✘ MALA</button>
      </div>
    </div>

    <div class="footer-actions">
      <button class="action-btn" onclick="renderSelfMenu()">
        <span class="soul-icon">❤️</span>
        <span>FASE 9</span>
      </button>
      <button class="action-btn hint-btn" onclick="toggleSelfHint()">
        <span class="soul-icon">❤️</span>
        <span>PISTA</span>
      </button>
      <button class="action-btn" id="selfNextBtn" style="display:none;" onclick="nextSelf()">
        <span class="soul-icon">❤️</span>
        <span>${isLast ? 'VER RESULTADOS' : 'SIGUIENTE'} ➔</span>
      </button>
    </div>
  `;

  scrollToTopSafe();
  const field = document.getElementById('selfInput');
  if (field && isCloze) {
    // En escritorio se enfoca solo; en móvil evitamos abrir el teclado sin que lo pidas
    if (window.matchMedia && window.matchMedia('(hover: hover)').matches) field.focus();
  }
}

function toggleSelfHint() {
  unlockAudioContext();
  playBleep(440, 'triangle', 0.08);
  const hintBox = document.getElementById('hintBox');
  if (!hintBox || !selfState) return;
  const item = selfState.items[selfState.idx];
  if (hintBox.style.display === 'block') {
    hintBox.style.display = 'none';
    return;
  }
  hintBox.style.display = 'block';
  hintBox.innerHTML = selfState.kind === 'cloze'
    ? `💡 <strong>PISTA:</strong><br>${clozeHint(item)}`
    : `💡 <strong>PISTA:</strong><br>${escapeHTML(item.hint)}`;
}

/* ---------- Comprobar ---------- */
function checkSelf() {
  unlockAudioContext();
  const st = selfState;
  if (!st || st.checked) return;
  const item = st.items[st.idx];
  const field = document.getElementById('selfInput');
  const panel = document.getElementById('revealPanel');
  const checkBtn = document.getElementById('checkBtn');
  const markZone = document.getElementById('markZone');
  if (!field || !panel) return;

  const userText = field.value.trim();
  st.checked = true;
  field.readOnly = true;
  field.blur();
  if (checkBtn) checkBtn.style.display = 'none';

  if (st.kind === 'cloze') {
    const sentence = document.getElementById('selfSentence');
    if (sentence) sentence.innerHTML = clozeSentenceHTML(item, true);

    let verdict;
    if (!userText) {
      verdict = `<div class="verdict warn">🔎 No escribiste ninguna respuesta.</div>`;
    } else if (matchesCloze(userText, item.a)) {
      verdict = `<div class="verdict ok">🔎 Tu respuesta coincide con la esperada.</div>`;
    } else {
      verdict = `<div class="verdict warn">🔎 No coincide palabra por palabra. Si significa lo mismo, tú decides si cuenta como buena.</div>`;
    }

    panel.innerHTML = `
      <div class="reveal-title">RESPUESTA CORRECTA</div>
      <div class="reveal-answer">${escapeHTML(item.a[0])}</div>
      <div class="reveal-mine">Tu respuesta: <em>${userText ? escapeHTML(userText) : '(en blanco)'}</em></div>
      ${verdict}
      <div class="reveal-exp">${escapeHTML(item.exp)}</div>
    `;
  } else {
    const blankNote = userText ? '' : `<div class="verdict warn" style="margin-bottom:10px;">🔎 No escribiste ninguna respuesta.</div>`;
    panel.innerHTML = `
      ${blankNote}
      <div class="reveal-title">RESPUESTA DE DESARROLLO CORRECTA</div>
      <div class="reveal-model">${escapeHTML(item.model).replace(/\n/g, '<br><br>')}</div>
      <div class="reveal-title" style="margin-top:14px;">IDEAS CLAVE QUE DEBÍAS INCLUIR</div>
      <ul class="key-list">${item.keys.map(k => `<li>${escapeHTML(k)}</li>`).join('')}</ul>
    `;
  }

  panel.style.display = 'block';
  if (markZone) markZone.style.display = 'block';
  playBleep(523.3, 'triangle', 0.12);
  try { panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
}

/* ---------- Marcar buena / mala ---------- */
function markSelf(result) {
  unlockAudioContext();
  const st = selfState;
  if (!st || !st.checked || st.marked) return;
  st.marked = true;
  const item = st.items[st.idx];
  getMarks()[item.id] = result;

  const good = document.getElementById('markGood');
  const bad = document.getElementById('markBad');
  if (good) { good.disabled = true; if (result === 'good') good.classList.add('chosen'); }
  if (bad) { bad.disabled = true; if (result === 'bad') bad.classList.add('chosen'); }

  if (result === 'good') {
    st.good++;
    playBleep(587.3, 'triangle', 0.15);
  } else {
    st.bad++;
    st.failedIds.push(item.id);
    playBleep(196, 'sawtooth', 0.2);
  }
  persistProgress();
  setSelfStatus();

  const nextBtn = document.getElementById('selfNextBtn');
  if (nextBtn) {
    nextBtn.style.display = 'flex';
    try { nextBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
  }
}

function nextSelf() {
  unlockAudioContext();
  if (!selfState) return;
  selfState.idx++;
  if (selfState.idx < selfState.items.length) {
    renderSelfQuestion();
  } else {
    finishSelfSession();
  }
}

/* ---------- Resultados ---------- */
function finishSelfSession() {
  const st = selfState;
  const container = document.getElementById('screenContent');
  if (!st || !container) return;

  const phaseId = st.kind === 'cloze' ? 91 : 92;
  if (!st.review && !userProgress.completedPhases.includes(phaseId)) {
    userProgress.completedPhases.push(phaseId);
  }
  persistProgress();
  playVictorySound();

  const bar = document.getElementById('statusBar');
  if (bar) bar.style.display = 'none';

  const total = st.items.length;
  let rank = 'C - Administrador Junior';
  if (st.good >= total * 0.9) rank = 'S - ADMINISTRADOR LEGENDARIO';
  else if (st.good >= total * 0.75) rank = 'A - GERENTE ESTRATÉGICO';
  else if (st.good >= total * 0.5) rank = 'B - ANALISTA SENIOR';

  const failed = st.items.filter(it => st.failedIds.includes(it.id));
  const failedHTML = failed.length === 0 ? '' : `
    <div class="review-list">
      <div class="review-head">PARA REPASAR (${failed.length}):</div>
      ${failed.map(it => `<div class="review-item">${
        st.kind === 'cloze' ? clozeSentenceHTML(it, true) : `<strong>${escapeHTML(it.q)}</strong>`
      }</div>`).join('')}
    </div>
  `;

  const kindLabel = st.kind === 'cloze' ? 'FRASES' : 'DESARROLLOS';
  const badNow = (st.kind === 'cloze' ? CLOZE_BANK : DEV_BANK).filter(i => getMarks()[i.id] === 'bad').length;

  container.innerHTML = `
    <div class="screen-overlay">
      <div style="font-size:38px; margin-bottom:14px;">🏆❤️</div>
      <div class="screen-title" style="color:#00ff00;">¡SESIÓN DE ${kindLabel} COMPLETADA!</div>
      <div style="margin:10px 0 16px; border:3px solid var(--ut-yellow); padding:14px; font-size:10.5px; line-height:1.8;">
        BUENAS: <span style="color:var(--hp-green);">${st.good}</span> / ${total}<br>
        MALAS: <span style="color:#ff6666;">${st.bad}</span><br>
        RANGO: <span style="color:var(--ut-yellow);">${rank}</span>
      </div>
      ${failedHTML}
      <div class="menu-grid" style="margin-top:14px;">
        ${badNow > 0 ? `
        <button class="option-btn" style="border-color:#ff6666; color:#ff6666;" onclick="startSelfSession('${st.kind}', true)">
          <span class="soul-icon">❤️</span>
          <span>🔁 REPASAR SOLO LAS MALAS</span>
          <span class="phase-badge" style="border-color:#ff6666; color:#ff6666;">${badNow}</span>
        </button>` : ''}
        <button class="option-btn" onclick="startSelfSession('${st.kind}', false)">
          <span class="soul-icon">❤️</span>
          <span>REPETIR TODO (NUEVO ORDEN)</span>
        </button>
        <button class="option-btn" onclick="renderSelfMenu()">
          <span class="soul-icon">❤️</span>
          <span>VOLVER A LA FASE 9</span>
        </button>
        <button class="option-btn" onclick="renderMainMenu()">
          <span class="soul-icon">❤️</span>
          <span>VOLVER AL MENÚ PRINCIPAL</span>
        </button>
      </div>
    </div>
  `;
  scrollToTopSafe();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', renderMainMenu);
} else {
  renderMainMenu();
}
</script>

</body>
</html>
